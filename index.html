<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Equitation Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{--bg:#F2F2F7;--card:#FFFFFF;--sep:rgba(60,60,67,0.13);--sep2:rgba(60,60,67,0.06);--label:#000;--label2:rgba(60,60,67,0.6);--label3:rgba(60,60,67,0.3);--fill:rgba(118,118,128,0.12);--fill2:rgba(118,118,128,0.08);--green:#34C759;--blue:#007AFF;--purple:#AF52DE;--red:#FF3B30;--orange:#FF9500;--tint:#007AFF;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--label);font-size:15px;min-height:100vh;}

/* LOGIN */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;}
.login-icon{font-size:64px;margin-bottom:20px;}
.login-title{font-size:32px;font-weight:900;letter-spacing:-1.5px;margin-bottom:6px;}
.login-sub{font-size:15px;color:var(--label2);margin-bottom:40px;line-height:1.5;}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--sep);border-radius:14px;padding:14px 24px;font-family:inherit;font-size:16px;font-weight:700;color:var(--label);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all .15s;}
.google-btn:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);}
.google-btn svg{width:22px;height:22px;}

/* HEADER */
.hd{background:rgba(242,242,247,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:52px 20px 12px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--sep);}
.hd-inner{display:flex;justify-content:space-between;align-items:flex-end;}
.hd-label{font-size:11px;font-weight:600;color:var(--label3);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.hd-title{font-size:34px;font-weight:800;color:var(--label);letter-spacing:-1.5px;line-height:1;}
.hd-right{display:flex;align-items:center;gap:8px;}
.hd-add{background:var(--label);border:none;border-radius:20px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:700;color:#fff;cursor:pointer;}
.hd-user{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--label2);}

/* TABS */
.tabs{display:flex;background:rgba(242,242,247,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--sep);position:sticky;top:104px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;padding:10px 4px;border:none;background:none;font-family:inherit;font-size:11px;font-weight:600;color:var(--label3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;transition:color .15s;}
.tab.on{color:var(--label);border-bottom-color:var(--label);font-weight:800;}

/* CONTENT */
.ct{padding:16px;padding-bottom:100px;}
.dn{display:none;}

/* ENTRY CARD */
.entry{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 0 var(--sep2);}
.entry-head{padding:14px 16px;cursor:pointer;}
.entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.entry-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px;}
.badge-마장마술{background:rgba(175,82,222,0.1);color:var(--purple);}
.badge-장애물{background:rgba(255,149,0,0.1);color:var(--orange);}
.badge-기본마술{background:rgba(0,122,255,0.1);color:var(--blue);}
.badge-자격증{background:rgba(52,199,89,0.1);color:var(--green);}
.badge-외승{background:rgba(52,199,89,0.1);color:var(--green);}
.entry-date{font-size:12px;font-weight:500;color:var(--label3);}
.entry-stable{font-size:20px;font-weight:800;color:var(--label);letter-spacing:-.8px;margin-bottom:2px;}
.entry-horse{font-size:14px;font-weight:500;color:var(--label2);}
.entry-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.entry-tag{font-size:12px;font-weight:500;padding:3px 8px;border-radius:8px;background:var(--fill);color:var(--label2);}
.entry-toggle{font-size:12px;color:var(--label3);margin-top:8px;font-weight:500;}
.entry-body{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;}
.entry-body.open{max-height:2000px;padding:0 16px 14px;}
.entry-divider{height:1px;background:var(--sep2);margin-bottom:12px;}
.entry-section{margin-bottom:12px;}
.entry-section-label{font-size:11px;font-weight:700;color:var(--label3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.entry-section-text{font-size:14px;color:var(--label);line-height:1.7;white-space:pre-wrap;}
.entry-hashtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.entry-hashtag{font-size:12px;font-weight:600;color:var(--tint);}
.entry-del{width:100%;padding:10px;background:rgba(255,59,48,0.06);border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--red);cursor:pointer;margin-top:8px;}

/* CAL */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-ym{font-size:22px;font-weight:800;letter-spacing:-.8px;}
.cal-arrows{display:flex;gap:8px;}
.cal-arrow{background:var(--fill);border:none;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;color:var(--label2);display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--label3);padding:6px 0;}
.cal-day{min-height:54px;display:flex;flex-direction:column;border-radius:8px;cursor:pointer;overflow:hidden;transition:background .1s;}
.cal-day-num{font-size:11px;font-weight:700;padding:4px 4px 2px;text-align:left;}
.cal-day.today .cal-day-num{color:var(--tint);font-weight:900;}
.cal-day.selected{outline:1.5px solid var(--label);}
.cal-day.has-entry{background:var(--card);box-shadow:0 1px 0 var(--sep2);}
.cal-dot{font-size:8px;font-weight:700;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top-width:1px;border-top-style:solid;}
.cal-dot.ride{background:rgba(175,82,222,0.1);color:var(--purple);border-top-color:rgba(175,82,222,0.2);}
.cal-dot.trail{background:rgba(52,199,89,0.1);color:var(--green);border-top-color:rgba(52,199,89,0.2);}
.cal-legend{display:flex;gap:12px;margin-bottom:12px;}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--label2);}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;}
.day-detail{margin-top:16px;}
.day-detail-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.day-detail-date{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.day-add-btn{background:var(--label);border:none;border-radius:20px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;}

/* FILTERS */
.filter-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;}
.filter-chip.on{background:var(--label);border-color:var(--label);color:#fff;}

/* PASSES */
.pass-card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:10px;box-shadow:0 1px 0 var(--sep2);}
.pass-stable{font-size:18px;font-weight:800;color:var(--label);letter-spacing:-.5px;margin-bottom:14px;}
.pass-counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pass-count{border-radius:12px;padding:14px;text-align:center;}
.pass-count.remain{background:rgba(0,122,255,0.08);}
.pass-count.used{background:var(--fill2);}
.pass-count-num{font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1;}
.pass-count.remain .pass-count-num{color:var(--tint);}
.pass-count.used .pass-count-num{color:var(--label3);}
.pass-count-lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:4px;color:var(--label3);}
.pass-row{display:flex;justify-content:space-between;font-size:13px;padding-bottom:6px;border-bottom:1px solid var(--sep2);margin-bottom:6px;}
.pass-row-lbl{font-weight:500;color:var(--label3);}
.pass-row-val{font-weight:700;color:var(--label);}
.pass-bar-bg{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:12px;}
.pass-bar-fill{height:100%;border-radius:2px;background:var(--tint);transition:width .5s;}
.pass-bar-pct{font-size:11px;color:var(--label3);font-weight:500;text-align:right;margin-top:4px;}
.pass-add-btn{width:100%;padding:14px;background:var(--card);border:1.5px dashed var(--sep);border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--label3);cursor:pointer;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.stat-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 0 var(--sep2);}
.stat-val{font-size:28px;font-weight:900;color:var(--label);letter-spacing:-1.5px;line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:11px;font-weight:600;color:var(--label3);letter-spacing:.5px;text-transform:uppercase;}
.bar-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--sep2);}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-lbl{font-size:12px;font-weight:500;color:var(--label2);width:64px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-bg{flex:1;height:14px;background:var(--fill);border-radius:7px;overflow:hidden;}
.bar-fill{height:100%;background:var(--label);border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:20px;}
.bar-num{font-size:9px;color:#fff;font-weight:800;}
.stats-sec-title{font-size:13px;font-weight:700;color:var(--label2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.stats-filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;}
.stats-filter::-webkit-scrollbar{display:none;}
.stats-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;}
.stats-chip.on{background:var(--label);border-color:var(--label);color:#fff;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;padding:11px 16px 11px 40px;background:var(--card);border:1px solid var(--sep);border-radius:12px;font-family:inherit;font-size:15px;color:var(--label);outline:none;box-shadow:0 1px 0 var(--sep2);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--label3);pointer-events:none;}
.search-suggestions{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 0 var(--sep2);}
.search-sug-item{padding:12px 16px;border-bottom:1px solid var(--sep2);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;}
.search-sug-item:last-child{border-bottom:none;}
.search-sug-tag{color:var(--tint);font-weight:700;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.modal-bg.on{display:flex;}
.modal{background:var(--bg);width:100%;max-height:94vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .28s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-hd{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(242,242,247,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--sep);z-index:1;}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.modal-close{background:var(--fill);border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--label2);font-weight:700;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:16px 16px 40px;}
.form-sec{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 0 var(--sep2);}
.form-lbl{font-size:11px;font-weight:700;color:var(--label3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.form-lbl span{color:var(--tint);margin-right:4px;}
.form-input{width:100%;padding:10px 12px;background:var(--fill2);border:1px solid var(--sep);border-radius:10px;font-family:inherit;font-size:15px;color:var(--label);outline:none;}
.form-input:focus{border-color:var(--tint);}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-sel-row{display:flex;gap:6px;flex-wrap:wrap;}
.form-sel{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--fill2);font-family:inherit;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;white-space:nowrap;transition:all .12s;}
.form-sel.on{background:var(--label);border-color:var(--label);color:#fff;}
.form-sel-duo{display:flex;gap:8px;}
.form-sel-duo .form-sel{flex:1;text-align:center;}
.form-textarea{width:100%;padding:10px 12px;background:var(--fill2);border:1px solid var(--sep);border-radius:10px;font-family:inherit;font-size:14px;color:var(--label);outline:none;resize:vertical;line-height:1.7;}
.form-textarea:focus{border-color:var(--tint);}
.form-select{width:100%;padding:10px 12px;background:var(--fill2);border:1px solid var(--sep);border-radius:10px;font-family:inherit;font-size:15px;color:var(--label);outline:none;appearance:none;-webkit-appearance:none;}
.save-btn{width:100%;padding:16px;background:var(--label);border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;color:#fff;cursor:pointer;margin-top:14px;letter-spacing:-.3px;}

/* CONFIRM */
.confirm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.confirm-bg.on{display:flex;}
.confirm-box{background:var(--card);border-radius:18px;width:100%;max-width:290px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.confirm-body{padding:20px;text-align:center;}
.confirm-title{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px;}
.confirm-sub{font-size:13px;color:var(--label2);line-height:1.5;}
.confirm-btns{display:flex;border-top:1px solid var(--sep);}
.confirm-btn{flex:1;padding:14px;border:none;background:none;font-family:inherit;font-size:17px;cursor:pointer;}
.confirm-btn.cancel{color:var(--tint);font-weight:500;border-right:1px solid var(--sep);}
.confirm-btn.del{color:var(--red);font-weight:700;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px 40px;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:17px;font-weight:700;color:var(--label);margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--label3);line-height:1.5;}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--label3);font-size:14px;}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen" class="login-wrap">
  <div class="login-icon">🐴</div>
  <div class="login-title">Equitation Journal</div>
  <div class="login-sub">나의 승마 기록을 관리하세요<br>Google 계정으로 시작하기</div>
  <button class="google-btn" onclick="signInGoogle()">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google로 로그인
  </button>
</div>

<!-- 앱 화면 -->
<div id="app-screen" style="display:none">
  <div class="hd">
    <div class="hd-inner">
      <div>
        <div class="hd-label">Equitation Journal</div>
        <div class="hd-title" id="page-title">캘린더</div>
      </div>
      <div class="hd-right">
        <button class="hd-add" id="hd-add-btn">＋ 기록</button>
        <button class="hd-user" onclick="showUserMenu()" id="user-avatar">👤</button>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="goTab('cal')">캘린더</button>
    <button class="tab" onclick="goTab('journal')">일지</button>
    <button class="tab" onclick="goTab('passes')">이용권</button>
    <button class="tab" onclick="goTab('stats')">통계</button>
    <button class="tab" onclick="goTab('search')">검색</button>
  </div>
  <div class="ct">
    <div id="pg-cal"><div class="loading">불러오는 중...</div></div>
    <div id="pg-journal" class="dn"></div>
    <div id="pg-passes" class="dn"></div>
    <div id="pg-stats" class="dn"></div>
    <div id="pg-search" class="dn">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-q" placeholder="일지 검색... (#태그, 마명, 승마장)" oninput="doSearch()" autocomplete="off">
      </div>
      <div id="search-suggestions" class="search-suggestions" style="display:none"></div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<!-- 새 일지 모달 -->
<div class="modal-bg" id="entryModal" onclick="if(event.target===this)closeEntry()">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title">새 기록</div>
      <button class="modal-close" onclick="closeEntry()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-sec">
        <div class="form-sel-duo" id="type-btns">
          <button class="form-sel on" onclick="setFType('ride')">🐴 기승</button>
          <button class="form-sel" onclick="setFType('trail')">🌿 외승</button>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl"><span>①</span>날짜</div>
        <input class="form-input" type="date" id="f-date">
      </div>
      <div class="form-sec">
        <div class="form-lbl"><span>②</span>승마장</div>
        <select class="form-select" id="f-stable" onchange="updatePassPreview()">
          <option value="">승마장 선택</option>
        </select>
        <input class="form-input" type="text" id="f-stable-custom" placeholder="직접 입력" style="display:none;margin-top:8px">
        <div id="pass-preview" style="margin-top:8px;display:none;font-size:12px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--fill2);color:var(--label2)"></div>
      </div>
      <div class="form-sec">
        <div class="form-grid2">
          <div><div class="form-lbl"><span>③</span>마명</div><input class="form-input" type="text" id="f-horse" placeholder="말 이름"></div>

function makeEntryCard(e){
  var tags=extractTags((e.brief||'')+(e.detail||''));
  var weather=e.temp?e.temp+'°C'+(e.hum?' · '+e.hum+'%':''):'';
  var meta=[e.arena,e.gear,weather,e.coach?'코치: '+e.coach:''].filter(Boolean);
  var catLabel=e.type==='trail'?'외승':e.cat;
  return '<div class="entry" id="entry-'+e.id+'">'
    +'<div class="entry-head" onclick="togEntry(\''+e.id+'\')">'
    +'<div class="entry-top"><span class="entry-badge badge-'+catLabel+'">'+catLabel+'</span><span class="entry-date">'+e.date+(e.isTrip||e.is_trip?' 🗺️':'')+'</span></div>'
    +'<div class="entry-stable">'+e.stable+'</div>'
    +(e.horse?'<div class="entry-horse">'+e.horse+'</div>':'')
    +(meta.length?'<div class="entry-meta">'+meta.map(function(t){return'<span class="entry-tag">'+t+'</span>';}).join('')+'</div>':'')
    +'<div class="entry-toggle" id="tog-'+e.id+'">펼치기 ▼</div>'
    +'</div>'
    +'<div class="entry-body" id="body-'+e.id+'">'
    +'<div class="entry-divider"></div>'
    +(e.brief?'<div class="entry-section"><div class="entry-section-label">📝 간단 메모</div><div class="entry-section-text">'+e.brief+'</div></div>':'')
    +(e.detail?'<div class="entry-section"><div class="entry-section-label">📖 상세 일지</div><div class="entry-section-text">'+e.detail+'</div></div>':'')
    +(tags.length?'<div class="entry-hashtags">'+tags.map(function(t){return'<span class="entry-hashtag">'+t+'</span>';}).join('')+'</div>':'')
    +'<button class="entry-del" onclick="confirmDelete(\''+e.id+'\',\''+e.stable+' · '+e.date+'\')">삭제</button>'
    +'</div></div>';
}

// ── CALENDAR ──
function renderCal(){
  var byD={};
  ENTRIES.forEach(function(e){if(e.date){if(!byD[e.date])byD[e.date]=[];byD[e.date].push(e);}});
  var fd=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var today=new Date().toISOString().slice(0,10);
  var h='<div class="cal-nav"><div class="cal-ym">'+calY+'년 '+MO[calM]+'</div><div class="cal-arrows"><button class="cal-arrow" onclick="moveCal(-1)">‹</button><button class="cal-arrow" onclick="moveCal(1)">›</button></div></div>'
    +'<div class="cal-legend"><div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>기승</div><div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>외승</div></div>'
    +'<div class="cal-grid">';
  DW.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var day=1;day<=dim;day++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var es=byD[ds]||[];
    var isT=ds===today,isSel=ds===selDate,hasE=es.length>0;
    var dow=new Date(ds).getDay();
    var numColor=isT?'var(--tint)':dow===0?'var(--red)':dow===6?'var(--blue)':hasE?'var(--label)':'var(--label3)';
    h+='<div class="cal-day'+(isSel?' selected':'')+(hasE?' has-entry':'')+'" onclick="selDay(\''+ds+'\')" style="background:'+(isT?'rgba(0,122,255,0.06)':hasE?'var(--card)':'transparent')+';'+(isSel?'outline:1.5px solid var(--label);':'')+'">'
      +'<div class="cal-day-num" style="color:'+numColor+';font-weight:'+(isT||isSel?'900':'700')+'">'+day+'</div>';
    if(hasE){es.forEach(function(e){var cls=e.type==='trail'?'trail':'ride';h+='<div class="cal-dot '+cls+'">'+ss(e.stable)+(e.horse?' ('+e.horse.slice(0,2)+')':'')+'</div>';});}
    h+='</div>';
  }
  h+='</div>';
  if(selDate){
    var ses=byD[selDate]||[];
    h+='<div class="day-detail"><div class="day-detail-hd"><div class="day-detail-date">'+selDate.slice(5).replace('-','월 ')+'일</div><button class="day-add-btn" onclick="openNewEntry(\''+selDate+'\')">+ 추가</button></div>';
    if(ses.length){ses.forEach(function(e){h+=makeEntryCard(e);});}
    else h+='<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">이 날의 기록이 없어요</div></div>';
    h+='</div>';
  }
  document.getElementById('pg-cal').innerHTML=h;
}
function moveCal(dir){calM+=dir;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}selDate=null;renderCal();}
function selDay(ds){selDate=(selDate===ds)?null:ds;renderCal();}

// ── STATS ──
function renderStats(){
  var years=[...new Set(ENTRIES.map(function(e){return(e.date||'').slice(0,4);}).filter(Boolean))].sort().reverse();
  var fd;
  if(statsFilter==='전체')fd=ENTRIES;
  else if(statsFilter.endsWith('년'))fd=ENTRIES.filter(function(e){return(e.date||'').startsWith(statsFilter.replace('년',''));});
  else{var mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'].indexOf(statsFilter)+1;fd=ENTRIES.filter(function(e){return(e.date||'').slice(5,7)===String(mn).padStart(2,'0');});}
  var rides=fd.filter(function(e){return e.type==='ride';}).length;
  var trails=fd.filter(function(e){return e.type==='trail';}).length;
  var totalMin=fd.reduce(function(a,e){return a+(parseInt(e.duration)||0);},0);
  var hr=Math.floor(totalMin/60),mn2=totalMin%60;
  var totalCost=0;
  fd.forEach(function(e){var p=PASSES.find(function(p){return p.stable===e.stable;});if(p&&p.price&&p.total)totalCost+=Math.round(p.price/p.total);});
  function mk(fn){var o={};fd.forEach(function(e){var k=fn(e);if(k)o[k]=(o[k]||0)+1;});return Object.entries(o).sort(function(a,b){return b[1]-a[1];});}
  function bar(items){if(!items.length)return'<div style="padding:12px;color:var(--label3);font-size:13px">데이터 없음</div>';var mx=items[0][1];return items.slice(0,6).map(function(x){return'<div class="bar-row"><span class="bar-lbl">'+x[0]+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+(x[1]/mx*100).toFixed(0)+'%"><span class="bar-num">'+x[1]+'</span></div></div></div>';}).join('');}
  var chips=['전체',...years.map(function(y){return y+'년';}),'1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var h='<div class="stats-filter">'+chips.map(function(c){return'<button class="stats-chip'+(c===statsFilter?' on':'')+'" onclick="setStats(\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<div class="stats-grid">'
    +[['총 기승',rides+'회'],['외승',trails+'회'],['기승 비용',totalCost?fmt(totalCost):'-'],['기승 시간',totalMin?(hr+'h '+mn2+'m'):'-']].map(function(x){return'<div class="stat-card"><div class="stat-val">'+x[1]+'</div><div class="stat-lbl">'+x[0]+'</div></div>';}).join('')
    +'</div>';
  if(fd.length){
    h+='<div class="stats-sec-title" style="margin-bottom:8px">승마장별</div><div class="bar-card">'+bar(mk(function(e){return e.stable;}))+'</div>';
    h+='<div class="stats-sec-title" style="margin-bottom:8px">종목별</div><div class="bar-card">'+bar(mk(function(e){return e.type==='trail'?'외승':e.cat;}))+'</div>';
    if(statsFilter==='전체')h+='<div class="stats-sec-title" style="margin-bottom:8px">연도별</div><div class="bar-card">'+bar(mk(function(e){return(e.date||'').slice(0,4);}))+'</div>';
  } else h+='<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">기록을 추가하면 통계가 나타나요</div></div>';
  document.getElementById('pg-stats').innerHTML=h;
}
function setStats(f){statsFilter=f;renderStats();}

// ── SEARCH ──
function doSearch(){
  var q=document.getElementById('search-q').value.trim();
  var sugEl=document.getElementById('search-suggestions');
  var resEl=document.getElementById('search-results');
  if(!q){sugEl.style.display='none';resEl.innerHTML='';return;}
  var allTags={};
  ENTRIES.forEach(function(e){extractTags((e.brief||'')+(e.detail||'')).forEach(function(t){allTags[t]=(allTags[t]||0)+1;});});
  var tagList=Object.entries(allTags).sort(function(a,b){return b[1]-a[1];}).map(function(x){return x[0];});
  var partial=q.startsWith('#')?q:'#'+q;
  var matched=tagList.filter(function(t){return t.startsWith(partial)||t.slice(1).startsWith(q);});
  if(matched.length&&q.length>=1){sugEl.style.display='block';sugEl.innerHTML=matched.slice(0,6).map(function(t){return'<div class="search-sug-item" onclick="setSearchQ(\''+t+'\')"><span class="search-sug-tag">'+t+'</span></div>';}).join('');}
  else sugEl.style.display='none';
  var r=ENTRIES.filter(function(e){var full=(e.stable||'')+(e.horse||'')+(e.coach||'')+(e.brief||'')+(e.detail||'')+(e.cat||'');return full.includes(q);}).slice().reverse();
  if(!r.length)resEl.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">검색 결과 없음</div></div>';
  else resEl.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--label3);margin-bottom:10px">'+r.length+'개</div>'+r.map(makeEntryCard).join('');
}
function setSearchQ(t){document.getElementById('search-q').value=t;document.getElementById('search-suggestions').style.display='none';doSearch();}

// ── NEW ENTRY ──
function updateStableDropdown(){
  var sel=document.getElementById('f-stable');
  var prev=sel.value;
  sel.innerHTML='<option value="">승마장 선택</option>';
  PASSES.forEach(function(p){sel.innerHTML+='<option value="'+p.stable+'">'+p.stable+'</option>';});
  sel.innerHTML+='<option value="__other__">직접 입력</option>';
  if(prev)sel.value=prev;
  updatePassPreview();
}
function updatePassPreview(){
  var stable=document.getElementById('f-stable').value;
  var custom=document.getElementById('f-stable-custom');
  custom.style.display=stable==='__other__'?'block':'none';
  var actualStable=stable==='__other__'?custom.value:stable;
  var p=PASSES.find(function(x){return x.stable===actualStable;});
  var el=document.getElementById('pass-preview');
  if(p){el.style.display='block';el.style.color=p.remain<=3?'var(--red)':'var(--label2)';el.textContent='기승권 '+p.remain+'회 남음';}
  else el.style.display='none';
}
function openNewEntry(date){
  document.getElementById('f-date').value=date||new Date().toISOString().slice(0,10);
  ['f-horse','f-coach','f-gear','f-temp','f-hum','f-brief','f-detail'].forEach(function(id){document.getElementById(id).value='';});
  setFType('ride');setFCat('마장마술');setFArena('실내');setFTrip(false);
  updateStableDropdown();
  document.getElementById('entryModal').className='modal-bg on';
}
function closeEntry(){document.getElementById('entryModal').className='modal-bg';}
function setFType(t){fType=t;document.querySelectorAll('#type-btns .form-sel').forEach(function(b,i){b.className='form-sel'+(i===(t==='ride'?0:1)?' on':'');});document.getElementById('category-sec').style.display=t==='trail'?'none':'block';}
function setFCat(c){fCat=c;document.querySelectorAll('#cat-btns .form-sel').forEach(function(b){b.className='form-sel'+(b.textContent===c?' on':'');});}
function setFArena(a){fArena=a;document.querySelectorAll('#arena-btns .form-sel').forEach(function(b){b.className='form-sel'+(b.textContent===a?' on':'');});}
function setFTrip(v){fTrip=v;document.querySelectorAll('#trip-btns .form-sel').forEach(function(b,i){b.className='form-sel'+(i===(v?1:0)?' on':'');});}

async function saveEntry(){
  var stableVal=document.getElementById('f-stable').value;
  var stableCustom=document.getElementById('f-stable-custom').value.trim();
  var stable=stableVal==='__other__'?stableCustom:stableVal;
  var dt=document.getElementById('f-date').value;
  if(!stable){alert('승마장을 선택해주세요');return;}
  if(!dt){alert('날짜를 입력해주세요');return;}
  var e={
    id:'tmp-'+uid(),date:dt,type:fType,stable:stable,
    horse:document.getElementById('f-horse').value.trim(),
    coach:document.getElementById('f-coach').value.trim(),
    cat:fType==='trail'?'외승':fCat,
    arena:fArena,isTrip:fTrip,is_trip:fTrip,
    gear:document.getElementById('f-gear').value.trim(),
    temp:document.getElementById('f-temp').value,
    hum:document.getElementById('f-hum').value,
    brief:document.getElementById('f-brief').value.trim(),
    detail:document.getElementById('f-detail').value.trim()
  };
  ENTRIES.push(e);
  ENTRIES.sort(function(a,b){return a.date<b.date?-1:1;});
  var p=PASSES.find(function(x){return x.stable===stable;});
  if(p&&p.remain>0){p.remain--;sbUpdatePassRemain(p.id,p.remain);}
  closeEntry();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  sbAddEntry(e);
}

// ── PASS ──
function openPass(){
  ['p-stable','p-remain','p-purchase','p-expiry','p-price','p-count-custom'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('p-count-custom').style.display='none';
  setPCount(10);
  document.getElementById('passModal').className='modal-bg on';
}
function closePass(){document.getElementById('passModal').className='modal-bg';}
function setPCount(n){
  pCount=n;
  document.querySelectorAll('#p-count-btns .form-sel').forEach(function(b){
    var v=b.textContent==='직접입력'?-1:parseInt(b.textContent);
    b.className='form-sel'+(v===n?' on':'');
  });
  document.getElementById('p-count-custom').style.display=(n===-1)?'block':'none';
}
async function savePass(){
  var stable=document.getElementById('p-stable').value.trim();
  if(!stable){alert('승마장명을 입력해주세요');return;}
  var total=pCount===-1?parseInt(document.getElementById('p-count-custom').value)||0:pCount;
  var remain=parseInt(document.getElementById('p-remain').value);
  if(isNaN(remain))remain=total;
  var p={id:'tmp-'+uid(),stable,total,remain,
    purchase:document.getElementById('p-purchase').value,
    expiry:document.getElementById('p-expiry').value,
    price:parseInt(document.getElementById('p-price').value)||0};
  PASSES.push(p);
  closePass();
  renderPasses();
  await sbAddPass(p);
}

// ── DELETE ──
function confirmDelete(id,label){deleteId=id;document.getElementById('confirm-sub').textContent=label+'\n이 기록을 삭제할까요?';document.getElementById('confirmModal').className='confirm-bg on';}
function closeConfirm(){document.getElementById('confirmModal').className='confirm-bg';deleteId=null;}
async function doDelete(){
  if(!deleteId)return;
  sbDeleteEntry(deleteId);
  ENTRIES=ENTRIES.filter(function(e){return e.id!==deleteId;});
  closeConfirm();
  var el=document.getElementById('entry-'+deleteId);
  if(el)el.remove();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  if(curTab==='search')doSearch();
}
</script>
