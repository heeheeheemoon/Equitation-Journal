<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Equitation Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F0E8;--card:#FFFDF9;
  --br:#5C3D1E;--br2:#8B5E3C;--br3:#C4956A;--br4:#EBD9C0;--br5:#F2E8D8;
  --sep:rgba(92,61,30,0.12);--sep2:rgba(92,61,30,0.07);
  --tx:#1A0F06;--tx2:rgba(26,15,6,0.55);--tx3:rgba(26,15,6,0.32);
  --green:#2E7D52;--greenL:rgba(46,125,82,0.09);
  --red:#B33A2F;--redL:rgba(179,58,47,0.09);
  --purple:#6B3A9A;--purpleL:rgba(107,58,154,0.09);
  --pink:#B0456E;--pinkL:rgba(176,69,110,0.09);
  --blue:#2A5A8A;--blueL:rgba(42,90,138,0.09);
  --orange:#A8520A;--orangeL:rgba(168,82,10,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;font-weight:400;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font-family:inherit}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;text-align:center;background:linear-gradient(170deg,#2C1006 0%,#4A2810 50%,#7A4E28 100%)}
.login-logo{font-size:56px;margin-bottom:24px}
.login-title{font-size:28px;font-weight:700;color:#FFF8F0;letter-spacing:-.3px;margin-bottom:4px}
.login-sub{font-size:12px;color:rgba(255,248,240,0.4);margin-bottom:52px;letter-spacing:2.5px;text-transform:uppercase;font-weight:300}
.google-btn{display:flex;align-items:center;gap:11px;background:#FFF8F0;border-radius:12px;padding:13px 22px;font-size:15px;font-weight:500;color:var(--tx);box-shadow:0 2px 16px rgba(0,0,0,0.25);letter-spacing:-.2px}
.google-btn svg{width:20px;height:20px;flex-shrink:0}

/* HEADER */
.hd{background:rgba(44,16,6,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:46px 20px 13px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(196,149,106,0.18)}
.hd-inner{display:flex;justify-content:space-between;align-items:flex-end}
.hd-label{font-size:9px;font-weight:400;color:rgba(196,149,106,0.6);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:3px}
.hd-title{font-size:22px;font-weight:600;color:#FFF8F0;letter-spacing:-.4px;line-height:1}
.hd-right{display:flex;gap:7px;align-items:center}
.hd-add{background:rgba(196,149,106,0.15);border:1px solid rgba(196,149,106,0.3);border-radius:18px;padding:6px 13px;font-size:12px;font-weight:500;color:var(--br3);letter-spacing:.1px}
.hd-avatar{width:28px;height:28px;border-radius:50%;border:1px solid rgba(196,149,106,0.35);overflow:hidden;cursor:pointer;background:var(--br2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.hd-avatar img{width:100%;height:100%;object-fit:cover}

/* TABS */
.tabs{display:flex;background:rgba(36,12,2,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:86px;z-index:99;border-bottom:1px solid rgba(196,149,106,0.12);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:10px 4px;font-size:10px;font-weight:400;color:rgba(196,149,106,0.35);border-bottom:1.5px solid transparent;margin-bottom:-1px;text-align:center;white-space:nowrap;letter-spacing:.8px;text-transform:uppercase;transition:color .15s}
.tab.on{color:var(--br3);border-bottom-color:var(--br3);font-weight:600}

.ct{padding:16px;padding-bottom:100px}
.dn{display:none}

/* ENTRY CARD - 참고 디자인 스타일 */
.ec{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;border:1px solid var(--sep2);box-shadow:0 1px 8px rgba(92,61,30,0.06)}
.ec.open{border-color:rgba(139,94,60,0.22)}
.ec-future{opacity:.45}
.ec-head{padding:15px 16px;cursor:pointer}
.ec-date-line{font-size:13px;font-weight:600;color:var(--tx);letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ec-date-line .ec-num{font-size:11px;font-weight:400;color:var(--tx3);margin-left:auto}
.ec-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;letter-spacing:.1px}
.chip-horse{background:rgba(139,94,60,0.1);color:var(--br2)}
.chip-stable{background:rgba(92,61,30,0.07);color:var(--tx2)}
.chip-cat{background:var(--purpleL);color:var(--purple)}
.chip-cat.장애물{background:var(--orangeL);color:var(--orange)}
.chip-cat.기본마술{background:var(--blueL);color:var(--blue)}
.chip-cat.자격증{background:var(--greenL);color:var(--green)}
.chip-cat.외승{background:var(--pinkL);color:var(--pink)}
.chip-cat.미분류{background:rgba(92,61,30,0.06);color:var(--tx3)}
.chip-fall{background:var(--redL);color:var(--red)}
.chip-future{background:rgba(92,61,30,0.05);color:var(--tx3);border:1px dashed var(--sep)}
.chip-weather{background:var(--br5);color:var(--tx3)}
.ec-body{max-height:0;overflow:hidden;transition:max-height .32s ease}
.ec-body.open{max-height:3000px}
.ec-body-inner{border-top:1px solid var(--sep2);padding:13px 16px}
.ec-section{margin-bottom:12px}
.ec-section-label{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:1.3px;text-transform:uppercase;margin-bottom:5px}
.ec-section-text{font-size:13px;font-weight:400;color:var(--tx);line-height:1.8;white-space:pre-wrap;word-break:break-word}
.ec-hash-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ec-hash-tag{font-size:11px;font-weight:500;color:var(--br2);opacity:.8}
.ec-actions{display:flex;gap:6px;margin-top:11px}
.ec-btn{flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:500;letter-spacing:.1px}
.ec-btn-edit{background:var(--br5);border:1px solid var(--sep);color:var(--br2)}
.ec-btn-del{background:var(--redL);border:1px solid rgba(179,58,47,0.18);color:var(--red)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px}
.cal-ym{font-size:18px;font-weight:600;color:var(--tx);letter-spacing:-.4px}
.cal-arrows{display:flex;gap:5px;align-items:center}
.cal-arrow{background:var(--card);border:1px solid var(--sep);border-radius:7px;width:28px;height:28px;font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.cal-today-btn{background:var(--br2);border-radius:7px;padding:5px 10px;font-size:10px;font-weight:600;color:#fff;letter-spacing:.3px}
.cal-legend{display:flex;gap:10px;margin-bottom:10px}
.cal-legend-item{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:400;color:var(--tx3)}
.cal-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:9px;font-weight:500;color:var(--tx3);padding:5px 0;letter-spacing:.3px}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-day{min-height:52px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid transparent}
.cal-day.has-entry{background:var(--card);border-color:var(--sep2);box-shadow:0 1px 3px rgba(92,61,30,0.05)}
.cal-day.today{border-color:var(--br2)!important;background:rgba(139,94,60,0.04)!important}
.cal-day.selected{border-color:var(--br)!important;border-width:1.5px!important}
.cal-day-num{font-size:10px;font-weight:500;padding:4px 4px 2px;color:var(--tx)}
.cal-day.today .cal-day-num{color:var(--br);font-weight:700}
.cal-day.sun .cal-day-num,.cal-day.holiday .cal-day-num{color:var(--red)}
.cal-day.sat .cal-day-num{color:var(--blue)}
.cal-entry-row{display:flex;align-items:center;gap:3px;padding:1px 3px}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-dot.ride{background:var(--purple)}
.cal-dot.trail{background:var(--pink)}
.cal-dot.future{background:var(--tx3)}
.cal-dot.fall{background:var(--red)}
.cal-entry-label{font-size:8px;font-weight:500;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cal-entry-label.fall{color:var(--red)}
.day-detail{margin-top:14px;padding-top:13px;border-top:1.5px solid var(--br4)}
.day-detail-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.day-date-big{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.day-add-btn{background:var(--br);border-radius:16px;padding:6px 13px;font-size:11px;font-weight:600;color:#fff}

/* PASSES */
.pass-group-label{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pass-group-label::after{content:'';flex:1;height:1px;background:var(--sep)}
.pass-card{background:var(--card);border-radius:13px;padding:14px;margin-bottom:8px;border:1px solid var(--sep2);box-shadow:0 1px 5px rgba(92,61,30,0.04)}
.pass-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pass-name{font-size:14px;font-weight:600;color:var(--tx);letter-spacing:-.2px}
.pass-tag{font-size:9px;font-weight:600;color:var(--br3);background:rgba(196,149,106,0.1);border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:middle}
.pass-bd{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.pass-act{display:flex;gap:5px;margin-bottom:10px}
.pass-act-btn{padding:4px 9px;border-radius:7px;font-size:10px;font-weight:500}
.pass-act-edit{background:var(--br5);border:1px solid var(--sep);color:var(--br2)}
.pass-act-del{background:var(--redL);border:1px solid rgba(179,58,47,0.18);color:var(--red)}
.pass-counts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.pass-count{border-radius:9px;padding:10px;text-align:center}
.pass-count.remain{background:var(--greenL)}
.pass-count.used{background:var(--br5)}
.pass-count-num{font-size:24px;font-weight:700;line-height:1;letter-spacing:-1px}
.pass-count.remain .pass-count-num{color:var(--green)}
.pass-count.used .pass-count-num{color:var(--tx3)}
.pass-count-lbl{font-size:9px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;color:var(--tx3)}
.pass-info-row{display:flex;justify-content:space-between;font-size:11px;padding-bottom:5px;border-bottom:1px solid var(--sep2);margin-bottom:5px}
.pass-info-lbl{color:var(--tx3);font-weight:400}
.pass-info-val{color:var(--tx);font-weight:600}
.pass-bar-bg{height:3px;background:var(--br4);border-radius:2px;overflow:hidden;margin-top:8px}
.pass-bar-fill{height:100%;border-radius:2px;background:var(--green);transition:width .5s}
.pass-bar-pct{font-size:9px;color:var(--tx3);font-weight:400;text-align:right;margin-top:3px}
.pass-low .pass-count.remain{background:var(--redL)}
.pass-low .pass-count.remain .pass-count-num{color:var(--red)}
.pass-low .pass-bar-fill{background:var(--red)}
.pass-add-btn{width:100%;padding:12px;background:var(--card);border:1.5px dashed var(--sep);border-radius:11px;font-size:12px;font-weight:500;color:var(--tx3)}

/* STATS */
.stats-year-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.stats-year-tabs::-webkit-scrollbar{display:none}
.stats-year-tab{flex-shrink:0;padding:5px 14px;border-radius:16px;border:1px solid var(--sep);background:var(--card);font-size:11px;font-weight:500;color:var(--tx2)}
.stats-year-tab.on{background:var(--br);border-color:var(--br);color:#fff;font-weight:600}
.stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.stats-card{background:var(--card);border-radius:11px;padding:13px;border:1px solid var(--sep2)}
.stats-val{font-size:20px;font-weight:700;color:var(--br);letter-spacing:-1px;line-height:1;margin-bottom:3px}
.stats-lbl{font-size:9px;font-weight:500;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase}
.stats-month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.stats-month-card{background:var(--card);border-radius:9px;padding:8px 6px;border:1px solid var(--sep2);text-align:center}
.stats-month-num{font-size:9px;font-weight:500;color:var(--tx3);margin-bottom:3px}
.stats-month-val{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
.stats-sec-title{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.stats-sec-title::after{content:'';flex:1;height:1px;background:var(--sep)}
.bar-card{background:var(--card);border-radius:11px;padding:11px;margin-bottom:9px;border:1px solid var(--sep2)}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-lbl{font-size:10px;font-weight:400;color:var(--tx2);width:56px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:12px;background:var(--br5);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--br2);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;min-width:16px;transition:width .5s}
.bar-num{font-size:8px;color:#fff;font-weight:600}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:10px 14px 10px 38px;background:var(--card);border:1px solid var(--sep);border-radius:11px;font-size:13px;color:var(--tx);outline:none;font-weight:400}
.search-input:focus{border-color:var(--br2)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.search-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.search-tag{padding:4px 10px;border-radius:16px;background:var(--card);border:1px solid var(--sep);font-size:11px;font-weight:500;color:var(--br2)}

/* FILTER */
.filter-bar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 12px;border-radius:16px;border:1px solid var(--sep);background:var(--card);font-size:11px;font-weight:500;color:var(--tx2)}
.filter-chip.on{background:var(--br);border-color:var(--br);color:#fff;font-weight:600}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,6,0,0.5);z-index:300;align-items:flex-end;backdrop-filter:blur(6px)}
.modal-bg.on{display:flex}
.modal{background:var(--bg);width:100%;max-height:93vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .24s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{padding:13px 17px 11px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(247,240,232,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--sep);z-index:1}
.modal-title{font-size:16px;font-weight:600;color:var(--tx);letter-spacing:-.2px}
.modal-close{background:rgba(92,61,30,0.1);border-radius:50%;width:27px;height:27px;font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 14px 36px}

/* FORM */
.form-sec{background:var(--card);border-radius:12px;padding:13px;margin-bottom:9px;border:1px solid var(--sep2)}
.form-lbl{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.form-input{width:100%;padding:9px 11px;background:var(--br5);border:1px solid var(--sep);border-radius:9px;font-size:13px;color:var(--tx);outline:none;font-weight:400}
.form-input:focus{border-color:var(--br2)}
.form-textarea{width:100%;padding:9px 11px;background:var(--br5);border:1px solid var(--sep);border-radius:9px;font-size:13px;color:var(--tx);outline:none;resize:vertical;line-height:1.78;font-weight:400}
.form-textarea:focus{border-color:var(--br2)}
.form-select{width:100%;padding:9px 11px;background:var(--br5);border:1px solid var(--sep);border-radius:9px;font-size:13px;color:var(--tx);outline:none;appearance:none}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.form-sel-row{display:flex;gap:5px;flex-wrap:wrap}
.form-sel{flex-shrink:0;padding:6px 12px;border-radius:16px;border:1px solid var(--sep);background:var(--br5);font-size:11px;font-weight:500;color:var(--tx2);white-space:nowrap}
.form-sel.on{background:var(--br);border-color:var(--br);color:#fff;font-weight:600}
.form-sel-duo{display:flex;gap:7px}
.form-sel-duo .form-sel{flex:1;text-align:center}
.form-check-row{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--redL);border:1px solid rgba(179,58,47,0.18);border-radius:9px;cursor:pointer}
.form-check-row input{width:16px;height:16px;accent-color:var(--red);cursor:pointer}
.form-check-lbl{font-size:12px;font-weight:500;color:var(--red)}
.save-btn{width:100%;padding:14px;background:var(--br);border-radius:12px;font-size:14px;font-weight:600;color:#fff;margin-top:12px;letter-spacing:-.1px}
.ai-btn{width:100%;padding:9px;background:linear-gradient(135deg,#3D1670,#6B3A9A);border-radius:9px;font-size:12px;font-weight:500;color:#fff;margin-top:7px;display:flex;align-items:center;justify-content:center;gap:5px}
.pass-preview-box{margin-top:6px;display:none;font-size:11px;padding:6px 10px;border-radius:8px;font-weight:500}

/* CONFIRM */
.confirm-bg{display:none;position:fixed;inset:0;background:rgba(20,6,0,0.5);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.confirm-bg.on{display:flex}
.confirm-box{background:var(--card);border-radius:16px;width:100%;max-width:275px;overflow:hidden;box-shadow:0 16px 48px rgba(92,61,30,0.18)}
.confirm-body{padding:18px;text-align:center}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--tx)}
.confirm-sub{font-size:12px;color:var(--tx2);line-height:1.5;font-weight:400}
.confirm-btns{display:flex;border-top:1px solid var(--sep)}
.confirm-btn{flex:1;padding:13px;font-size:15px}
.confirm-btn.cancel{color:var(--br2);font-weight:400;border-right:1px solid var(--sep)}
.confirm-btn.del{color:var(--red);font-weight:600}

.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:38px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:5px}
.empty-sub{font-size:12px;color:var(--tx3);line-height:1.5;font-weight:400}

.import-banner{background:linear-gradient(135deg,var(--br),var(--br2));border-radius:13px;padding:15px;margin-bottom:13px;color:#fff}
.import-banner-title{font-size:13px;font-weight:600;margin-bottom:3px}
.import-banner-sub{font-size:11px;opacity:.7;margin-bottom:10px;font-weight:400}
.import-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:9px;padding:9px;font-size:11px;font-weight:600;color:#fff;width:100%}

  <div class="login-logo">🐴</div>
  <div class="login-title">Equitation Journal</div>
  <div class="login-sub">My Riding Log</div>
  <button class="google-btn" onclick="signInGoogle()">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>

<script>
var SB_URL='https://pkcgihivkaxulhhkshxb.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrY2dpaGl2a2F4dWxoaGtzaHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NzU4OTIsImV4cCI6MjEwMTU1MTg5Mn0.vUphMcQrODHe_Y5Iff57GtIqFrvtMjEi94Hq8m8xWio';
var sb=supabase.createClient(SB_URL,SB_KEY);
var ENTRIES=[],PASSES=[],curUser=null;
var curTab='cal',calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=null;
var fType='ride',fCat='마장마술',editEntryId=null,newDate=null;
var editPassId=null,pCount=10,deleteTarget=null;
var jFilter='전체',statsYear='전체';
var TODAY=new Date().toISOString().slice(0,10);
var DW=['일','월','화','수','목','금','토'];
var MO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var CATS=['기본마술','마장마술','장애물','자격증'];
var HOLIDAYS={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){return n!=null?Number(n).toLocaleString()+'원':'-';}
function ss(s){if(!s)return'';if(s.includes('에이스'))return'에이스';if(s.includes('노바'))return'노바';if(s.includes('정철희')||s.includes('천안'))return'정철희';if(s.includes('홀스'))return'홀스메이트';if(s.includes('소노'))return'소노';if(s.includes('비스타'))return'비스타';if(s.includes('TK'))return'TK';if(s.includes('양주'))return'양주';if(s.includes('유니콘'))return'유니콘';if(s.includes('워너비'))return'워너비';if(s.includes('세인트'))return'세인트';return s.slice(0,4);}
function extractTags(t){if(!t)return[];var m=t.match(/#[\w가-힣]+/g);return m?[...new Set(m)]:[]; }
function dday(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000);}
function fmtDate(d){if(!d)return'';var w=['일','월','화','수','목','금','토'];var dt=new Date(d+'T00:00:00');return d.replace(/-/g,'.')+'('+w[dt.getDay()]+')';}
function isFuture(d){return d>TODAY;}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

async function signInGoogle(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});}
function showUserMenu(){if(confirm((curUser?.email||'')+'\n\n로그아웃 하시겠어요?'))sb.auth.signOut().then(function(){location.reload();});}

async function loadData(){
  var[eR,pR]=await Promise.all([
    sb.from('entries').select('*').eq('user_id',curUser.id).order('date',{ascending:true}),
    sb.from('passes').select('*').eq('user_id',curUser.id).order('purchase',{ascending:true})
  ]);
  ENTRIES=(eR.data||[]).map(function(e){return Object.assign({},e,{isTrip:e.is_trip});});
  PASSES=pR.data||[];
}
async function sbAdd(t,r){var{data,error}=await sb.from(t).insert(r).select();if(error){console.error(error);return null;}return data&&data[0];}
async function sbUpdate(t,id,r){await sb.from(t).update(r).eq('id',id);}
async function sbDelete(t,id){await sb.from(t).delete().eq('id',id);}

sb.auth.onAuthStateChange(async function(event,session){
  if(session&&session.user){
    curUser=session.user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    var img=document.getElementById('user-img');
    if(curUser.user_metadata&&curUser.user_metadata.avatar_url)img.src=curUser.user_metadata.avatar_url;
    await loadData();renderCal();
  } else {
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
  }
});

var TITLES={cal:'캘린더',journal:'일지',passes:'이용권',stats:'통계',search:'검색'};
function goTab(t){
  curTab=t;
  ['cal','journal','passes','stats','search'].forEach(function(x){document.getElementById('pg-'+x).className=(x===t)?'':'dn';});
  document.querySelectorAll('.tab').forEach(function(b,i){b.className='tab'+(['cal','journal','passes','stats','search'][i]===t?' on':'');});
  document.getElementById('page-title').textContent=TITLES[t];
  document.getElementById('hd-add-btn').style.display=(t==='search')?'none':'block';
  if(t==='cal')renderCal();
  if(t==='journal')renderJournal();
  if(t==='passes')renderPasses();
  if(t==='stats')renderStats();
  if(t==='search'){renderSearchTags();document.getElementById('search-q').focus();}
}

// ENTRY CARD
function makeEntryCard(e){
  var future=isFuture(e.date);
  var cat=e.type==='trail'?'외승':(e.cat||'미분류');
  var tags=extractTags((e.brief||'')+(e.detail||''));
  var gear=[e.saddle?'안장 '+e.saddle:'',e.rein?'고삐 '+e.rein:''].filter(Boolean).join(' · ');
  return '<div class="ec'+(future?' ec-future':'')+'" id="ec-'+e.id+'">'
    +'<div class="ec-head" onclick="togEC(\''+e.id+'\')">'
    +'<div class="ec-date-line">'+fmtDate(e.date)+(e.num&&e.num<9999?'<span class="ec-num">#'+Math.floor(e.num)+'</span>':'')+'</div>'
    +'<div class="ec-chips">'
    +(e.horse?'<span class="chip chip-horse">🐴 '+e.horse+(e.horse_type?' · '+e.horse_type:'')+'</span>':'')
    +'<span class="chip chip-stable">📍 '+ss(e.stable)+'</span>'
    +'<span class="chip chip-cat '+cat+'">'+cat+'</span>'
    +(e.is_fall?'<span class="chip chip-fall">⚠️ 낙마</span>':'')
    +(future?'<span class="chip chip-future">예정</span>':'')
    +(e.weather||e.temp?'<span class="chip chip-weather">'+(e.weather||'')+(e.temp?' '+e.temp+'°C':'')+'</span>':'')
    +'</div>'
    +(gear?'<div style="font-size:11px;color:var(--tx3);margin-top:7px;font-weight:400">'+gear+'</div>':'')
    +'</div>'
    +'<div class="ec-body" id="body-'+e.id+'">'
    +'<div class="ec-body-inner">'
    +(e.brief?'<div class="ec-section"><div class="ec-section-label">메모</div><div class="ec-section-text">'+e.brief+'</div></div>':'')
    +(e.detail?'<div class="ec-section"><div class="ec-section-label">상세 일지</div><div class="ec-section-text">'+e.detail+'</div></div>':'')
    +(tags.length?'<div class="ec-hash-tags">'+tags.map(function(t){return'<span class="ec-hash-tag">'+t+'</span>';}).join(' ')+'</div>':'')
    +'<div class="ec-actions"><button class="ec-btn ec-btn-edit" onclick="openEditEntry(\''+e.id+'\')">수정</button><button class="ec-btn ec-btn-del" onclick="confirmDelete(\'entry\',\''+e.id+'\',\''+ss(e.stable)+' '+fmtDate(e.date)+'\')">삭제</button></div>'
    +'</div></div></div>';
}
function togEC(id){var body=document.getElementById('body-'+id);var ec=document.getElementById('ec-'+id);if(!body)return;var open=body.classList.contains('open');body.classList.toggle('open',!open);ec.classList.toggle('open',!open);}

// CALENDAR
function renderCal(){
  var byD={};
  ENTRIES.forEach(function(e){if(e.date){if(!byD[e.date])byD[e.date]=[];byD[e.date].push(e);}});
  var fd=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var h='<div class="cal-nav"><div class="cal-ym">'+calY+'년 '+MO[calM]+'</div>'
    +'<div class="cal-arrows"><button class="cal-today-btn" onclick="goToday()">오늘</button>'
    +'<button class="cal-arrow" onclick="moveCal(-1)">‹</button><button class="cal-arrow" onclick="moveCal(1)">›</button></div></div>'
    +'<div class="cal-legend">'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>기승</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--pink)"></div>외승</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--tx3)"></div>예정</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--red)"></div>낙마⚠️</div>'
    +'</div><div class="cal-grid">';
  DW.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var day=1;day<=dim;day++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var es=byD[ds]||[];
    var isT=ds===TODAY,isSel=ds===selDate,hasE=es.length>0;
    var dow=new Date(ds+'T00:00:00').getDay();
    var mmdd=String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isHol=!!HOLIDAYS[mmdd];
    var cls=['cal-day'];
    if(hasE)cls.push('has-entry');
    if(isT)cls.push('today');
    if(isSel)cls.push('selected');
    if(dow===0||isHol)cls.push('sun');
    else if(dow===6)cls.push('sat');
    h+='<div class="'+cls.join(' ')+'" onclick="selDay(\''+ds+'\')">'
      +'<div class="cal-day-num">'+day+'</div>';
    if(hasE){
      es.forEach(function(e){
        var future=isFuture(e.date);
        var dotCls=e.is_fall?'fall':future?'future':e.type==='trail'?'trail':'ride';
        var pass=PASSES.find(function(p){return p.stable===e.stable&&p.remain>0;});
        var passInfo=pass?'('+pass.remain+')':'';
        h+='<div class="cal-entry-row">'
          +'<div class="cal-dot '+dotCls+'"></div>'
          +'<div class="cal-entry-label'+(e.is_fall?' fall':'')+'">'+ss(e.stable)+passInfo+(e.is_fall?' ⚠️':'')+'</div>'
          +'</div>';
      });
    }
    h+='</div>';
  }
  h+='</div>';
  if(selDate){
    var ses=byD[selDate]||[];
    h+='<div class="day-detail"><div class="day-detail-hd">'
      +'<div class="day-date-big">'+fmtDate(selDate)+'</div>'
      +'<button class="day-add-btn" onclick="openNewEntry(\''+selDate+'\')">+ 추가</button></div>';
    if(ses.length)ses.forEach(function(e){h+=makeEntryCard(e);});
    else h+='<div class="empty" style="padding:22px"><div class="empty-icon">📝</div><div class="empty-title">기록 없음</div></div>';
    h+='</div>';
  }
  if(ENTRIES.length===0){
    h='<div class="import-banner"><div class="import-banner-title">📥 기존 기승 데이터 불러오기</div>'
      +'<div class="import-banner-sub">구글 캘린더에서 파싱한 300개 기록을 불러옵니다</div>'
      +'<button class="import-btn" onclick="importData()">데이터 임포트 시작</button></div>'+h;
  }
  document.getElementById('pg-cal').innerHTML=h;
}
function moveCal(dir){calM+=dir;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}selDate=null;renderCal();}
function selDay(ds){selDate=(selDate===ds)?null:ds;renderCal();}
function goToday(){calY=new Date().getFullYear();calM=new Date().getMonth();selDate=TODAY;renderCal();}

function renderJournal(){
  var cats=['전체','기본마술','마장마술','장애물','자격증','외승','미분류'];
  var filtered=ENTRIES.filter(function(e){
    if(jFilter==='전체')return true;
    if(jFilter==='외승')return e.type==='trail';
    if(jFilter==='미분류')return e.type!=='trail'&&!e.cat;
    return e.type!=='trail'&&e.cat===jFilter;
  }).slice().reverse();
  var h='<div style="margin-top:14px"><div class="filter-bar">'+cats.map(function(c){return'<button class="filter-chip'+(c===jFilter?' on':'')+'" onclick="setJFilter(\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<div style="font-size:11px;color:var(--tx3);font-weight:400;margin-bottom:11px">'+filtered.length+'개</div>';
  if(!filtered.length)h+='<div class="empty"><div class="empty-icon">🐴</div><div class="empty-title">기록이 없어요</div></div>';
  else filtered.forEach(function(e){h+=makeEntryCard(e);});
  h+='</div>';
  document.getElementById('pg-journal').innerHTML=h;
}
function setJFilter(f){jFilter=f;renderJournal();}

function renderPasses(){
  var groups={};
  PASSES.forEach(function(p){if(!groups[p.stable])groups[p.stable]=[];groups[p.stable].push(p);});
  var h='<div style="margin-top:14px">';
  if(!PASSES.length)h+='<div class="empty"><div class="empty-icon">🎫</div><div class="empty-title">등록된 이용권이 없어요</div></div>';
  Object.keys(groups).sort().forEach(function(stable){
    var passes=groups[stable].sort(function(a,b){return(a.purchase||'')>(b.purchase||'')?1:-1;});
    h+='<div class="pass-group-label">'+stable+'</div>';
    passes.forEach(function(p,idx){
      var remain=p.remain,used=(p.total||0)-remain;
      var pct=p.total?Math.round(remain/p.total*100):0;
      var isLow=remain<=3;
      var dd=dday(p.expiry);
      var per=(p.price&&p.total)?Math.round(p.price/p.total):null;
      var tag=passes.length>1?String(idx+1).padStart(2,'0'):'';
      h+='<div class="pass-card'+(isLow?' pass-low':'')+'" style="border-color:'+(isLow?'rgba(179,58,47,0.25)':'var(--sep2)')+'">'
        +'<div class="pass-hd"><div><span class="pass-name">'+p.stable+'</span>'+(tag?'<span class="pass-tag">'+tag+'</span>':'')+'</div>'
        +'<div class="pass-bd">'
        +(isLow?'<span class="chip chip-fall" style="font-size:9px;padding:2px 7px">잔여부족</span>':'')
        +(dd!=null?'<span class="chip" style="font-size:9px;padding:2px 7px;background:'+(dd<=14?'var(--redL)':'var(--br5)')+';color:'+(dd<=14?'var(--red)':'var(--tx3)')+'">D-'+dd+'</span>':'')
        +'</div></div>'
        +'<div class="pass-act"><button class="pass-act-btn pass-act-edit" onclick="openEditPass(\''+p.id+'\')">수정</button><button class="pass-act-btn pass-act-del" onclick="confirmDelete(\'pass\',\''+p.id+'\',\''+p.stable+' 이용권\')">삭제</button></div>'
        +'<div class="pass-counts"><div class="pass-count remain"><div class="pass-count-num">'+remain+'</div><div class="pass-count-lbl">남음</div></div>'
        +'<div class="pass-count used"><div class="pass-count-num">'+used+'</div><div class="pass-count-lbl">사용</div></div></div>'
        +[p.total?['총 횟수',p.total+'회']:null,p.purchase?['구매일',p.purchase]:null,p.expiry?['만료일',p.expiry]:null,p.price?['쿠폰가격',fmt(p.price)]:null,per?['회당가격',fmt(per)]:null].filter(Boolean).map(function(r){return'<div class="pass-info-row"><span class="pass-info-lbl">'+r[0]+'</span><span class="pass-info-val">'+r[1]+'</span></div>';}).join('')
        +'<div class="pass-bar-bg"><div class="pass-bar-fill" style="width:'+pct+'%'+(isLow?';background:var(--red)':'')+'"></div></div>'
        +'<div class="pass-bar-pct">'+pct+'% 남음</div></div>';
    });
  });
  h+='<button class="pass-add-btn" style="margin-top:8px" onclick="openNewPass()">+ 이용권 등록</button></div>';
  document.getElementById('pg-passes').innerHTML=h;
}

function renderStats(){
  var years=[...new Set(ENTRIES.map(function(e){return(e.date||'').slice(0,4);}).filter(Boolean))].sort().reverse();
  var fd=statsYear==='전체'?ENTRIES:ENTRIES.filter(function(e){return(e.date||'').startsWith(statsYear);});
  var rides=fd.filter(function(e){return e.type!=='trail';});
  var trails=fd.filter(function(e){return e.type==='trail';});
  var totalCost=rides.reduce(function(a,e){var p=PASSES.find(function(p){return p.stable===e.stable;});return a+(p&&p.price&&p.total?Math.round(p.price/p.total):0);},0);
  var h='<div style="margin-top:14px"><div class="stats-year-tabs">'+['전체',...years].map(function(y){return'<button class="stats-year-tab'+(y===statsYear?' on':'')+'" onclick="setStatsYear(\''+y+'\')">'+y+'</button>';}).join('')+'</div>';
  h+='<div class="stats-summary">'+[['기승',rides.length+'회'],['외승',trails.length+'회'],['기승 비용',totalCost?fmt(totalCost):'-'],['총 기록',fd.length+'개']].map(function(x){return'<div class="stats-card"><div class="stats-val">'+x[1]+'</div><div class="stats-lbl">'+x[0]+'</div></div>';}).join('')+'</div>';
  if(statsYear!=='전체'){
    h+='<div class="stats-sec-title">월별 기승</div><div class="stats-month-grid">';
    for(var m=1;m<=12;m++){var mS=statsYear+'-'+String(m).padStart(2,'0');var mE=fd.filter(function(e){return(e.date||'').startsWith(mS);});var mR=mE.filter(function(e){return e.type!=='trail';}).length;h+='<div class="stats-month-card"><div class="stats-month-num">'+m+'월</div><div class="stats-month-val">'+mR+'</div></div>';}
    h+='</div>';
  }
  function mk(arr,fn){var o={};arr.forEach(function(e){var k=fn(e);if(k)o[k]=(o[k]||0)+1;});return Object.entries(o).sort(function(a,b){return b[1]-a[1];});}
  function bar(items){if(!items.length)return'<div style="padding:8px;color:var(--tx3);font-size:11px">데이터 없음</div>';var mx=items[0][1];return items.slice(0,8).map(function(x){return'<div class="bar-row"><span class="bar-lbl">'+x[0]+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+(x[1]/mx*100).toFixed(0)+'%"><span class="bar-num">'+x[1]+'</span></div></div></div>';}).join('');}
  h+='<div class="stats-sec-title">종목별</div><div class="bar-card">'+bar(mk(rides,function(e){return e.cat||'미분류';}))+' </div>';
  h+='<div class="stats-sec-title">승마장별</div><div class="bar-card">'+bar(mk(fd,function(e){return ss(e.stable);}))+' </div>';
  if(statsYear==='전체')h+='<div class="stats-sec-title">연도별</div><div class="bar-card">'+bar(mk(fd,function(e){return(e.date||'').slice(0,4);}))+' </div>';
  h+='</div>';
  document.getElementById('pg-stats').innerHTML=h;
}
function setStatsYear(y){statsYear=y;renderStats();}

function renderSearchTags(){
  var tagMap={};
  ENTRIES.forEach(function(e){extractTags((e.brief||'')+(e.detail||'')).forEach(function(t){tagMap[t]=(tagMap[t]||0)+1;});});
  var top=Object.entries(tagMap).sort(function(a,b){return b[1]-a[1];}).slice(0,20).map(function(x){return x[0];});
  document.getElementById('search-tag-cloud').innerHTML=top.map(function(t){return'<button class="search-tag" onclick="setSearchQ(\''+t+'\')">'+t+'</button>';}).join('');
}
function doSearch(){
  var q=document.getElementById('search-q').value.trim();
  var resEl=document.getElementById('search-results');
  if(!q){resEl.innerHTML='';return;}
  var r=ENTRIES.filter(function(e){
    var full=(e.stable||'')+(e.horse||'')+(e.cat||'')+(e.brief||'')+(e.detail||'')+(e.coach||'');
    if(q.startsWith('#')){var tags=extractTags((e.brief||'')+(e.detail||''));return tags.some(function(t){return t.startsWith(q);});}
    return full.includes(q);
  }).slice().reverse();
  if(!r.length)resEl.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">결과 없음</div></div>';
  else resEl.innerHTML='<div style="font-size:11px;color:var(--tx3);font-weight:400;margin-bottom:10px">'+r.length+'개</div>'+r.map(makeEntryCard).join('');
}
function setSearchQ(t){document.getElementById('search-q').value=t;doSearch();}

function getPassOptions(){
  var valid=PASSES.filter(function(p){return p.remain>0;});
  return '<option value="">승마장 선택</option>'
    +valid.map(function(p){return'<option value="'+p.stable+'">'+p.stable+' ('+p.remain+'회 · '+p.expiry+')</option>';}).join('')
    +'<option value="__other__">직접 입력</option>';
}

    +'<div><div class="form-lbl">온도</div><input class="form-input" type="number" id="f-temp" value="'+(v.temp||'')+'" placeholder="°C" style="font-size:12px;padding:8px 10px"></div>'
    +'<div><div class="form-lbl">날씨</div><input class="form-input" type="text" id="f-weather" value="'+(v.weather||'')+'" placeholder="맑음/흐림/비" style="font-size:12px;padding:8px 10px"></div>'

    +'<div class="form-sec"><label class="form-check-row"><input type="checkbox" id="f-fall"'+(v.is_fall?' checked':'')+'>  <span class="form-check-lbl">⚠️ 낙마 발생</span></label></div>'

function openNewEntry(date){newDate=date||null;editEntryId=null;fType='ride';fCat='마장마술';document.getElementById('entry-modal-title').textContent='새 기록';document.getElementById('entry-modal-body').innerHTML=renderEntryForm(null);document.getElementById('entryModal').className='modal-bg on';}
function openEditEntry(id){var e=ENTRIES.find(function(x){return x.id===id;});if(!e)return;editEntryId=id;fType=e.type||'ride';fCat=e.cat||'마장마술';document.getElementById('entry-modal-title').textContent='기록 수정';document.getElementById('entry-modal-body').innerHTML=renderEntryForm(e);document.getElementById('entryModal').className='modal-bg on';var sel=document.getElementById('f-stable');if(sel){var exists=Array.from(sel.options).some(function(o){return o.value===e.stable;});if(!exists&&e.stable){var opt=document.createElement('option');opt.value=e.stable;opt.textContent=e.stable;sel.insertBefore(opt,sel.options[1]);}sel.value=e.stable||'';}updatePassPreview();updateTypeUI();}
function closeEntry(){document.getElementById('entryModal').className='modal-bg';}
function setFType(t){fType=t;updateTypeUI();}
function setFCat(c){fCat=c;document.querySelectorAll('#cat-btns .form-sel').forEach(function(b){b.className='form-sel'+(b.textContent===c?' on':'');});}
function updateTypeUI(){var isTrail=fType==='trail';var catSec=document.getElementById('cat-section');if(catSec)catSec.style.display=isTrail?'none':'block';var coachLbl=document.getElementById('coach-lbl');if(coachLbl)coachLbl.textContent=isTrail?'교관명':'코치';document.querySelectorAll('.form-sel-duo .form-sel').forEach(function(b,i){b.className='form-sel'+((i===0&&!isTrail)||(i===1&&isTrail)?' on':'');});}
function updatePassPreview(){var sel=document.getElementById('f-stable');var custom=document.getElementById('f-stable-custom');if(!sel)return;var isOther=sel.value==='__other__';if(custom)custom.style.display=isOther?'block':'none';var stable=isOther?(custom?custom.value:''):sel.value;var p=PASSES.find(function(x){return x.stable===stable;});var el=document.getElementById('pass-preview');if(el){if(p){el.style.display='block';el.style.background=p.remain<=3?'var(--redL)':'var(--greenL)';el.style.color=p.remain<=3?'var(--red)':'var(--green)';el.textContent='기승권 '+p.remain+'회 남음 · '+p.expiry+'까지';}else el.style.display='none';}}

async function saveEntry(){
  var sel=document.getElementById('f-stable');var custom=document.getElementById('f-stable-custom');
  var stable=sel&&sel.value==='__other__'?(custom?custom.value.trim():''):(sel?sel.value:'');
  var dt=document.getElementById('f-date').value;
  if(!stable){showToast('승마장을 선택해주세요');return;}
  if(!dt){showToast('날짜를 입력해주세요');return;}
  var catSel=document.querySelector('#cat-btns .form-sel.on');
  var row={user_id:curUser.id,date:dt,type:fType,stable:stable,
    horse:document.getElementById('f-horse').value.trim(),
    horse_type:document.getElementById('f-horse-type').value.trim(),
    coach:document.getElementById('f-coach').value.trim(),
    cat:fType==='trail'?'외승':(catSel?catSel.textContent:fCat||'마장마술'),
    saddle:document.getElementById('f-saddle').value.trim(),
    rein:document.getElementById('f-rein').value.trim(),
    temp:document.getElementById('f-temp').value,
    weather:document.getElementById('f-weather').value.trim(),
    brief:document.getElementById('f-brief').value.trim(),
    detail:document.getElementById('f-detail').value.trim(),
    is_fall:document.getElementById('f-fall').checked,
    is_trip:fType==='trail',arena:'실내'};
  if(editEntryId){await sbUpdate('entries',editEntryId,row);var idx=ENTRIES.findIndex(function(e){return e.id===editEntryId;});if(idx>=0)ENTRIES[idx]=Object.assign({},ENTRIES[idx],row,{isTrip:fType==='trail'});showToast('수정됐어! 🐴');}
  else{var saved=await sbAdd('entries',row);if(saved){ENTRIES.push(Object.assign({},row,{id:saved.id,isTrip:fType==='trail'}));ENTRIES.sort(function(a,b){return a.date<b.date?-1:1;});var p=PASSES.find(function(x){return x.stable===stable&&dt<=TODAY;});if(p&&p.remain>0){p.remain--;await sbUpdate('passes',p.id,{remain:p.remain});}showToast('저장됐어! 🐴');}}
  closeEntry();if(curTab==='cal')renderCal();if(curTab==='journal')renderJournal();if(curTab==='passes')renderPasses();
}

async function aiSummarize(){
  var detail=document.getElementById('f-detail').value.trim();
  if(!detail){showToast('상세 일지를 먼저 작성해주세요');return;}
  var btn=document.querySelector('.ai-btn');btn.textContent='✨ 요약 중...';btn.disabled=true;
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,messages:[{role:'user',content:'아래 승마 기승 일지를 핵심만 3-4줄로 요약해줘. 자세/고삐/추진/말특징 중 중요한 포인트 위주로, 한국어로.\n\n'+detail}]})});
    var data=await res.json();
    if(data.content&&data.content[0])document.getElementById('f-brief').value=data.content[0].text;
    showToast('요약 완료! ✨');
  }catch(err){showToast('API 키가 필요해요');}
  btn.textContent='✨ AI로 상세일지 요약하기';btn.disabled=false;
}

function renderPassForm(p){
  var v=p||{};
  return '<div class="form-sec"><div class="form-lbl">승마장명</div><input class="form-input" type="text" id="p-stable" value="'+(v.stable||'')+'" placeholder="승마장 이름"></div>'
    +'<div class="form-sec"><div class="form-lbl">총 횟수</div><div class="form-sel-row" id="p-count-btns">'+[10,20,30].map(function(n){return'<button class="form-sel'+(v.total===n?' on':'')+'" onclick="setPCount('+n+')">'+n+'회</button>';}).join('')+'<button class="form-sel'+(v.total&&![10,20,30].includes(v.total)?' on':'')+'" onclick="setPCount(-1)">직접</button></div>'
    +'<input class="form-input" type="number" id="p-total-custom" value="'+(v.total&&![10,20,30].includes(v.total)?v.total:'')+'" placeholder="횟수" style="display:'+(v.total&&![10,20,30].includes(v.total)?'block':'none')+';margin-top:7px"></div>'
    +(p?'<div class="form-sec"><div class="form-lbl">남은 횟수</div><input class="form-input" type="number" id="p-remain" value="'+(v.remain||0)+'" placeholder="현재 남은 횟수"></div>':'')
    +'<div class="form-sec"><div class="form-grid2"><div><div class="form-lbl">구매일</div><input class="form-input" type="date" id="p-purchase" value="'+(v.purchase||'')+'"></div><div><div class="form-lbl">만료일</div><input class="form-input" type="date" id="p-expiry" value="'+(v.expiry||'')+'"></div></div></div>'
    +'<div class="form-sec"><div class="form-lbl">쿠폰 가격 (원)</div><input class="form-input" type="number" id="p-price" value="'+(v.price||'')+'" placeholder="총 금액"></div>'
    +'<button class="save-btn" onclick="savePass()">저장</button>';
}
function openNewPass(){editPassId=null;pCount=10;document.getElementById('pass-modal-title').textContent='이용권 등록';document.getElementById('pass-modal-body').innerHTML=renderPassForm(null);document.getElementById('passModal').className='modal-bg on';}
function openEditPass(id){var p=PASSES.find(function(x){return x.id===id;});if(!p)return;editPassId=id;pCount=p.total||10;document.getElementById('pass-modal-title').textContent='이용권 수정';document.getElementById('pass-modal-body').innerHTML=renderPassForm(p);document.getElementById('passModal').className='modal-bg on';}
function closePass(){document.getElementById('passModal').className='modal-bg';}
function setPCount(n){pCount=n;document.querySelectorAll('#p-count-btns .form-sel').forEach(function(b){var v=b.textContent==='직접'?-1:parseInt(b.textContent);b.className='form-sel'+(v===n?' on':'');});document.getElementById('p-total-custom').style.display=(n===-1)?'block':'none';}
async function savePass(){
  var stable=document.getElementById('p-stable').value.trim();
  if(!stable){showToast('승마장명을 입력해주세요');return;}
  var total=pCount===-1?parseInt(document.getElementById('p-total-custom').value)||0:pCount;
  var remEl=document.getElementById('p-remain');
  var remain=remEl?parseInt(remEl.value):total;
  if(isNaN(remain))remain=total;
  var row={user_id:curUser.id,stable,total,remain,purchase:document.getElementById('p-purchase').value,expiry:document.getElementById('p-expiry').value,price:parseInt(document.getElementById('p-price').value)||0};
  if(editPassId){await sbUpdate('passes',editPassId,row);var idx=PASSES.findIndex(function(p){return p.id===editPassId;});if(idx>=0)PASSES[idx]=Object.assign({},PASSES[idx],row);showToast('수정됐어!');}
  else{var saved=await sbAdd('passes',row);if(saved){PASSES.push(Object.assign({},row,{id:saved.id}));showToast('등록됐어!');}}
  closePass();renderPasses();
}

function confirmDelete(type,id,label){deleteTarget={type,id};document.getElementById('confirm-sub').textContent=label+'\n복구할 수 없어요.';document.getElementById('confirmModal').className='confirm-bg on';}
function closeConfirm(){document.getElementById('confirmModal').className='confirm-bg';deleteTarget=null;}
async function doConfirm(){
  if(!deleteTarget)return;
  var type=deleteTarget.type,id=deleteTarget.id;
  await sbDelete(type==='entry'?'entries':'passes',id);
  if(type==='entry'){ENTRIES=ENTRIES.filter(function(e){return e.id!==id;});var el=document.getElementById('ec-'+id);if(el)el.remove();}
  else{PASSES=PASSES.filter(function(p){return p.id!==id;});renderPasses();}
  closeConfirm();if(curTab==='cal')renderCal();if(curTab==='journal')renderJournal();
  showToast('삭제됐어');
}

async function importData(){
  if(!confirm('기존 기승 데이터 300개를 불러올까요?\n이미 임포트했다면 중복될 수 있어요.'))return;
  try{
    var res=await fetch('./import_data.json');var data=await res.json();
    var BATCH=20,success=0;
    for(var i=0;i<data.length;i+=BATCH){
      var batch=data.slice(i,i+BATCH).map(function(r){return{user_id:curUser.id,date:r.date,num:r.num,type:r.type,stable:r.stable,horse:r.horse||'',coach:r.coach||'',cat:r.cat,arena:r.arena||'실내',is_trip:r.is_trip||false,gear:r.gear||'',temp:r.temp||'',hum:r.hum||'',brief:r.brief||'',detail:r.detail||'',is_fall:false};});
      var{error}=await sb.from('entries').insert(batch);if(!error)success+=batch.length;
      await new Promise(function(r){setTimeout(r,300);});
    }
    showToast('완료! '+success+'개 🎉');await loadData();renderCal();
  }catch(err){showToast('실패: '+err.message);}
}
