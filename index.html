<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Equitation Journal</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --sep: rgba(60,60,67,0.13);
  --sep2: rgba(60,60,67,0.06);
  --label: #000000;
  --label2: rgba(60,60,67,0.6);
  --label3: rgba(60,60,67,0.3);
  --fill: rgba(118,118,128,0.12);
  --fill2: rgba(118,118,128,0.08);
  --green: #34C759;
  --blue: #007AFF;
  --purple: #AF52DE;
  --red: #FF3B30;
  --orange: #FF9500;
  --acc: #5E3A1A;
  --acc2: #8B5E3C;
  --tint: #007AFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--label); font-size: 15px; min-height: 100vh; overscroll-behavior: none; }

/* ── HEADER ── */
.hd { background: rgba(242,242,247,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 52px 20px 12px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--sep); }
.hd-inner { display: flex; justify-content: space-between; align-items: flex-end; }
.hd-label { font-size: 11px; font-weight: 600; color: var(--label3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
.hd-title { font-size: 34px; font-weight: 800; color: var(--label); letter-spacing: -1.5px; line-height: 1; }
.hd-add { background: var(--label); border: none; border-radius: 20px; padding: 8px 16px; font-family: inherit; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 4px; }

/* ── TABS ── */
.tabs { display: flex; background: rgba(242,242,247,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--sep); position: sticky; top: 104px; z-index: 99; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1; padding: 10px 4px; border: none; background: none; font-family: inherit; font-size: 11px; font-weight: 600; color: var(--label3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; text-align: center; white-space: nowrap; letter-spacing: .3px; transition: color .15s; text-transform: uppercase; }
.tab.on { color: var(--label); border-bottom-color: var(--label); font-weight: 800; }

/* ── CONTENT ── */
.ct { padding: 16px; padding-bottom: 100px; }
.dn { display: none; }

/* ── CARD ── */
.card { background: var(--card); border-radius: 14px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 0 var(--sep2); }

/* ── CALENDAR ── */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-ym { font-size: 22px; font-weight: 800; letter-spacing: -.8px; }
.cal-arrows { display: flex; gap: 8px; }
.cal-arrow { background: var(--fill); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 14px; cursor: pointer; color: var(--label2); display: flex; align-items: center; justify-content: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--label3); padding: 6px 0; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border-radius: 10px; cursor: pointer; padding: 4px 2px; transition: background .1s; position: relative; }
.cal-day:active { background: var(--fill); }
.cal-day.today .cal-day-num { background: var(--label); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
.cal-day.has-entry { background: var(--card); box-shadow: 0 1px 0 var(--sep2); }
.cal-day.selected { background: var(--fill2); outline: 1.5px solid var(--label); }
.cal-day-num { font-size: 13px; font-weight: 600; color: var(--label); line-height: 26px; width: 26px; height: 26px; text-align: center; }
.cal-day.sun .cal-day-num { color: var(--red); }
.cal-day.sat .cal-day-num { color: var(--blue); }
.cal-dots { display: flex; gap: 2px; justify-content: center; margin-top: 2px; flex-wrap: wrap; padding: 0 2px; }
.cal-dot { font-size: 7px; line-height: 1; font-weight: 700; padding: 1px 3px; border-radius: 4px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cal-dot.ride { background: rgba(175,82,222,0.12); color: var(--purple); }
.cal-dot.trail { background: rgba(52,199,89,0.12); color: var(--green); }
.cal-legend { display: flex; gap: 12px; margin-bottom: 12px; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--label2); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── SELECTED DAY ── */
.day-detail { margin-top: 16px; }
.day-detail-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.day-detail-date { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
.day-add-btn { background: var(--label); border: none; border-radius: 20px; padding: 7px 14px; font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; }

/* ── ENTRY CARD ── */
.entry { background: var(--card); border-radius: 14px; margin-bottom: 8px; overflow: hidden; box-shadow: 0 1px 0 var(--sep2); }
.entry-head { padding: 14px 16px; cursor: pointer; }
.entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.entry-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: .3px; }
.badge-dressage { background: rgba(175,82,222,0.1); color: var(--purple); }
.badge-jump { background: rgba(255,149,0,0.1); color: var(--orange); }
.badge-basic { background: rgba(0,122,255,0.1); color: var(--blue); }
.badge-cert { background: rgba(52,199,89,0.1); color: var(--green); }
.badge-trail { background: rgba(52,199,89,0.1); color: var(--green); }
.entry-date { font-size: 12px; font-weight: 500; color: var(--label3); }
.entry-stable { font-size: 20px; font-weight: 800; color: var(--label); letter-spacing: -.8px; margin-bottom: 2px; }
.entry-horse { font-size: 14px; font-weight: 500; color: var(--label2); }
.entry-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.entry-tag { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 8px; background: var(--fill); color: var(--label2); }
.entry-toggle { font-size: 12px; color: var(--label3); margin-top: 8px; font-weight: 500; }
.entry-body { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height .3s ease, padding .3s ease; }
.entry-body.open { max-height: 2000px; padding: 0 16px 14px; }
.entry-divider { height: 1px; background: var(--sep2); margin-bottom: 12px; }
.entry-section { margin-bottom: 12px; }
.entry-section-label { font-size: 11px; font-weight: 700; color: var(--label3); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 4px; }
.entry-section-text { font-size: 14px; color: var(--label); line-height: 1.7; white-space: pre-wrap; }
.entry-hashtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.entry-hashtag { font-size: 12px; font-weight: 600; color: var(--tint); }
.entry-del { width: 100%; padding: 10px; background: rgba(255,59,48,0.06); border: none; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--red); cursor: pointer; margin-top: 8px; }

/* ── JOURNAL FILTERS ── */
.filter-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--sep); background: var(--card); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--label2); cursor: pointer; }
.filter-chip.on { background: var(--label); border-color: var(--label); color: #fff; }

/* ── PASSES ── */
.pass-card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--sep2); }
.pass-stable { font-size: 18px; font-weight: 800; color: var(--label); letter-spacing: -.5px; margin-bottom: 14px; }
.pass-counts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.pass-count { border-radius: 12px; padding: 14px; text-align: center; }
.pass-count.remain { background: rgba(0,122,255,0.08); }
.pass-count.used { background: var(--fill2); }
.pass-count-num { font-size: 36px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
.pass-count.remain .pass-count-num { color: var(--tint); }
.pass-count.used .pass-count-num { color: var(--label3); }
.pass-count-lbl { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; margin-top: 4px; color: var(--label3); }
.pass-info { display: flex; flex-direction: column; gap: 6px; }
.pass-row { display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 6px; border-bottom: 1px solid var(--sep2); }
.pass-row-lbl { font-weight: 500; color: var(--label3); }
.pass-row-val { font-weight: 700; color: var(--label); }
.pass-bar { margin-top: 12px; }
.pass-bar-bg { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.pass-bar-fill { height: 100%; border-radius: 2px; background: var(--tint); transition: width .5s; }
.pass-bar-pct { font-size: 11px; color: var(--label3); font-weight: 500; text-align: right; margin-top: 4px; }
.pass-low { border-color: rgba(255,59,48,0.3) !important; }
.pass-low .pass-count.remain { background: rgba(255,59,48,0.08); }
.pass-low .pass-count.remain .pass-count-num { color: var(--red); }
.pass-low .pass-bar-fill { background: var(--red); }
.pass-add-btn { width: 100%; padding: 14px; background: var(--card); border: 1.5px dashed var(--sep); border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--label3); cursor: pointer; }

/* ── STATS ── */
.stats-filter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
.stats-filter::-webkit-scrollbar { display: none; }
.stats-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--sep); background: var(--card); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--label2); cursor: pointer; }
.stats-chip.on { background: var(--label); border-color: var(--label); color: #fff; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 1px 0 var(--sep2); }
.stat-val { font-size: 28px; font-weight: 900; color: var(--label); letter-spacing: -1.5px; line-height: 1; margin-bottom: 4px; }
.stat-lbl { font-size: 11px; font-weight: 600; color: var(--label3); letter-spacing: .5px; text-transform: uppercase; }
.stats-sec-title { font-size: 13px; font-weight: 700; color: var(--label2); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
.bar-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--sep2); }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar-lbl { font-size: 12px; font-weight: 500; color: var(--label2); width: 64px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-bg { flex: 1; height: 14px; background: var(--fill); border-radius: 7px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--label); border-radius: 7px; display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; min-width: 20px; transition: width .5s; }
.bar-num { font-size: 9px; color: #fff; font-weight: 800; }

/* ── SEARCH ── */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-input { width: 100%; padding: 11px 16px 11px 40px; background: var(--card); border: 1px solid var(--sep); border-radius: 12px; font-family: inherit; font-size: 15px; color: var(--label); outline: none; box-shadow: 0 1px 0 var(--sep2); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--label3); pointer-events: none; }
.search-suggestions { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 1px 0 var(--sep2); }
.search-sug-item { padding: 12px 16px; border-bottom: 1px solid var(--sep2); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.search-sug-item:last-child { border-bottom: none; }
.search-sug-item:active { background: var(--fill); }
.search-sug-tag { color: var(--tint); font-weight: 700; }

/* ── MODAL ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: flex-end; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal-bg.on { display: flex; }
.modal { background: var(--bg); width: 100%; max-height: 94vh; border-radius: 20px 20px 0 0; overflow-y: auto; animation: slideUp .28s cubic-bezier(.32,.72,0,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-hd { padding: 16px 20px 12px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(242,242,247,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--sep); z-index: 1; }
.modal-title { font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
.modal-close { background: var(--fill); border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; cursor: pointer; color: var(--label2); font-weight: 700; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 16px 16px 40px; }
.form-sec { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--sep2); }
.form-lbl { font-size: 11px; font-weight: 700; color: var(--label3); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 8px; }
.form-lbl span { color: var(--tint); margin-right: 4px; }
.form-input { width: 100%; padding: 10px 12px; background: var(--fill2); border: 1px solid var(--sep); border-radius: 10px; font-family: inherit; font-size: 15px; color: var(--label); outline: none; }
.form-input:focus { border-color: var(--tint); }
.form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-sel-row { display: flex; gap: 6px; flex-wrap: wrap; }
.form-sel { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--sep); background: var(--fill2); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--label2); cursor: pointer; white-space: nowrap; transition: all .12s; }
.form-sel.on { background: var(--label); border-color: var(--label); color: #fff; }
.form-sel-duo { display: flex; gap: 8px; }
.form-sel-duo .form-sel { flex: 1; text-align: center; }
.form-textarea { width: 100%; padding: 10px 12px; background: var(--fill2); border: 1px solid var(--sep); border-radius: 10px; font-family: inherit; font-size: 14px; color: var(--label); outline: none; resize: vertical; line-height: 1.7; }
.form-textarea:focus { border-color: var(--tint); }
.form-select { width: 100%; padding: 10px 12px; background: var(--fill2); border: 1px solid var(--sep); border-radius: 10px; font-family: inherit; font-size: 15px; color: var(--label); outline: none; appearance: none; -webkit-appearance: none; }
.save-btn { width: 100%; padding: 16px; background: var(--label); border: none; border-radius: 14px; font-family: inherit; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; margin-top: 14px; letter-spacing: -.3px; }

/* ── CONFIRM ── */
.confirm-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.confirm-bg.on { display: flex; }
.confirm-box { background: var(--card); border-radius: 18px; width: 100%; max-width: 290px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.confirm-body { padding: 20px; text-align: center; }
.confirm-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.3px; }
.confirm-sub { font-size: 13px; color: var(--label2); line-height: 1.5; }
.confirm-btns { display: flex; border-top: 1px solid var(--sep); }
.confirm-btn { flex: 1; padding: 14px; border: none; background: none; font-family: inherit; font-size: 17px; cursor: pointer; }
.confirm-btn.cancel { color: var(--tint); font-weight: 500; border-right: 1px solid var(--sep); }
.confirm-btn.del { color: var(--red); font-weight: 700; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 60px 20px 40px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 17px; font-weight: 700; color: var(--label); margin-bottom: 6px; }
.empty-sub { font-size: 14px; color: var(--label3); line-height: 1.5; }

/* ── PASS MODAL ── */
.pass-form-option { display: flex; gap: 6px; }
.pass-form-option .form-sel { flex: 1; text-align: center; }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-inner">
    <div>
      <div class="hd-label">Equitation Journal</div>
      <div class="hd-title" id="page-title">캘린더</div>
    </div>
    <button class="hd-add" onclick="openNewEntry()" id="hd-add-btn">＋ 기록</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="goTab('cal')">캘린더</button>
  <button class="tab" onclick="goTab('journal')">일지</button>
  <button class="tab" onclick="goTab('passes')">이용권</button>
  <button class="tab" onclick="goTab('stats')">통계</button>
  <button class="tab" onclick="goTab('search')">검색</button>
</div>

<div class="ct">
  <div id="pg-cal"></div>
  <div id="pg-journal" class="dn"></div>
  <div id="pg-passes" class="dn"></div>
  <div id="pg-stats" class="dn"></div>
  <div id="pg-search" class="dn">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-q" placeholder="일지 검색... (#태그, 마명, 승마장)" oninput="doSearch()" autocomplete="off">
    </div>
    <div id="search-suggestions" class="search-suggestions" style="display:none"></div>
    <div id="search-results"></div>
  </div>
</div>

<!-- 새 일지 모달 -->
<div class="modal-bg" id="entryModal" onclick="if(event.target===this)closeEntry()">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title">새 기록</div>
      <button class="modal-close" onclick="closeEntry()">✕</button>
    </div>
    <div class="modal-body">
      <!-- 기승/외승 -->
      <div class="form-sec">
        <div class="form-sel-duo" id="type-btns">
          <button class="form-sel on" onclick="setType('ride')">🐴 기승</button>
          <button class="form-sel" onclick="setType('trail')">🌿 외승</button>
        </div>
      </div>

      <!-- 날짜 -->
      <div class="form-sec">
        <div class="form-lbl"><span>①</span>날짜</div>
        <input class="form-input" type="date" id="f-date">
      </div>

      <!-- 승마장 -->
      <div class="form-sec">
        <div class="form-lbl"><span>②</span>승마장</div>
        <select class="form-select" id="f-stable" onchange="updatePassPreview()">
          <option value="">승마장 선택</option>
        </select>
        <div id="pass-preview" style="margin-top:8px;display:none;font-size:12px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--fill2);color:var(--label2)"></div>
      </div>

      <!-- 마명 + 코치 -->
      <div class="form-sec">
        <div class="form-grid2">
          <div>
            <div class="form-lbl"><span>③</span>마명</div>
            <input class="form-input" type="text" id="f-horse" placeholder="말 이름">
          </div>
          <div>
            <div class="form-lbl"><span>④</span>코치</div>
            <input class="form-input" type="text" id="f-coach" placeholder="코치명 (선택)">
          </div>
        </div>
      </div>

      <!-- 종목 (기승일 때만) -->
      <div class="form-sec" id="category-sec">
        <div class="form-lbl"><span>⑤</span>종목</div>
        <div class="form-sel-row" id="cat-btns">
          <button class="form-sel on" onclick="setCat('마장마술')">마장마술</button>
          <button class="form-sel" onclick="setCat('장애물')">장애물</button>
          <button class="form-sel" onclick="setCat('기본마술')">기본마술</button>
          <button class="form-sel" onclick="setCat('자격증')">자격증</button>
        </div>
      </div>

      <!-- 마장 + 정기/원정 -->
      <div class="form-sec">
        <div class="form-grid2">
          <div>
            <div class="form-lbl"><span>⑥</span>마장</div>
            <div class="form-sel-duo">
              <button class="form-sel on" onclick="setArena('실내')">실내</button>
              <button class="form-sel" onclick="setArena('야외')">야외</button>
            </div>
          </div>
          <div>
            <div class="form-lbl"><span>⑦</span>구분</div>
            <div class="form-sel-duo">
              <button class="form-sel on" onclick="setTrip(false)">정기</button>
              <button class="form-sel" onclick="setTrip(true)">원정</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 장구 -->
      <div class="form-sec">
        <div class="form-lbl"><span>⑧</span>장구</div>
        <input class="form-input" type="text" id="f-gear" placeholder="안장, 레인 종류 등">
      </div>

      <!-- 날씨 -->
      <div class="form-sec">
        <div class="form-lbl"><span>⑨</span>날씨</div>
        <div class="form-grid2">
          <input class="form-input" type="number" id="f-temp" placeholder="온도 (°C)">
          <input class="form-input" type="number" id="f-hum" placeholder="습도 (%)">
        </div>
      </div>

      <!-- 간단 메모 -->
      <div class="form-sec">
        <div class="form-lbl">📝 간단 메모</div>
        <textarea class="form-textarea" id="f-brief" rows="3" placeholder="오늘 레슨 순서, 한줄 요약..."></textarea>
      </div>

      <!-- 상세 일지 -->
      <div class="form-sec">
        <div class="form-lbl">📖 상세 일지</div>
        <textarea class="form-textarea" id="f-detail" rows="8" placeholder="#사족&#10;느낀점, 감상, 컨디션...&#10;&#10;#기본운동&#10;&#10;#과목운동&#10;&#10;#연결 #경속보 등 태그 사용 가능"></textarea>
      </div>

      <button class="save-btn" onclick="saveEntry()">저장</button>
    </div>
  </div>
</div>

<!-- 이용권 추가 모달 -->
<div class="modal-bg" id="passModal" onclick="if(event.target===this)closePass()">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title">이용권 등록</div>
      <button class="modal-close" onclick="closePass()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-sec">
        <div class="form-lbl">승마장명</div>
        <input class="form-input" type="text" id="p-stable" placeholder="승마장 이름">
      </div>
      <div class="form-sec">
        <div class="form-lbl">총 횟수</div>
        <div class="pass-form-option" id="p-count-opts">
          <button class="form-sel on" onclick="setPCount(10)">10회</button>
          <button class="form-sel" onclick="setPCount(20)">20회</button>
          <button class="form-sel" onclick="setPCount(30)">30회</button>
          <button class="form-sel" onclick="setPCount(-1)">직접입력</button>
        </div>
        <input class="form-input" type="number" id="p-count-custom" placeholder="횟수 입력" style="display:none;margin-top:8px">
      </div>
      <div class="form-sec">
        <div class="form-lbl">남은 횟수</div>
        <input class="form-input" type="number" id="p-remain" placeholder="현재 남은 횟수">
      </div>
      <div class="form-sec">
        <div class="form-grid2">
          <div>
            <div class="form-lbl">구매일</div>
            <input class="form-input" type="date" id="p-purchase">
          </div>
          <div>
            <div class="form-lbl">만료일</div>
            <input class="form-input" type="date" id="p-expiry">
          </div>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">쿠폰 가격 (원)</div>
        <input class="form-input" type="number" id="p-price" placeholder="총 금액">
      </div>
      <button class="save-btn" onclick="savePass()">등록</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 -->
<div class="confirm-bg" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-body">
      <div class="confirm-title">기록 삭제</div>
      <div class="confirm-sub" id="confirm-sub">이 기록을 삭제할까요?<br>복구할 수 없어요.</div>
    </div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="closeConfirm()">취소</button>
      <button class="confirm-btn del" onclick="doDelete()">삭제</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
var ENTRIES = [];
var PASSES = [];
var curTab = 'cal';
var calY = new Date().getFullYear();
var calM = new Date().getMonth();
var selDate = null;
var fType = 'ride';
var fCat = '마장마술';
var fArena = '실내';
var fTrip = false;
var pCount = 10;
var deleteId = null;
var jFilter = '전체';
var statsFilter = '전체';

var MO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var DW = ['일','월','화','수','목','금','토'];
var TABS = { cal:'캘린더', journal:'일지', passes:'이용권', stats:'통계', search:'검색' };

// ── UTILS ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function fmt(n) { return n != null ? Number(n).toLocaleString() + '원' : '-'; }
function ss(s) {
  if (!s) return '';
  if (s.includes('에이스')) return '에이스';
  if (s.includes('노바')) return '노바';
  if (s.includes('정철희') || s.includes('천안')) return '정철희';
  return s.length > 6 ? s.slice(0,5)+'…' : s;
}
function extractTags(text) {
  if (!text) return [];
  var m = text.match(/#[\w가-힣]+/g);
  return m ? [...new Set(m)] : [];
}
function dday(d) {
  if (!d) return null;
  return Math.ceil((new Date(d) - new Date()) / 86400000);
}

// ── NAV ──
function goTab(t) {
  curTab = t;
  ['cal','journal','passes','stats','search'].forEach(function(x) {
    document.getElementById('pg-'+x).className = (x===t) ? '' : 'dn';
  });
  document.querySelectorAll('.tab').forEach(function(b,i) {
    b.className = 'tab' + (['cal','journal','passes','stats','search'][i]===t?' on':'');
  });
  document.getElementById('page-title').textContent = TABS[t];
  var addBtn = document.getElementById('hd-add-btn');
  addBtn.style.display = (t==='passes') ? 'flex' : (t==='cal'||t==='journal') ? 'flex' : 'none';
  if (t==='cal') renderCal();
  if (t==='journal') renderJournal();
  if (t==='passes') renderPasses();
  if (t==='stats') renderStats();
  if (t==='search') document.getElementById('search-q').focus();
}
document.getElementById('hd-add-btn').addEventListener('click', function() {
  if (curTab === 'passes') openPass();
  else openNewEntry();
});

// ── CALENDAR ──
function renderCal() {
  var byD = {};
  ENTRIES.forEach(function(e) { if(e.date){if(!byD[e.date])byD[e.date]=[];byD[e.date].push(e);} });
  var fd = new Date(calY, calM, 1).getDay();
  var dim = new Date(calY, calM+1, 0).getDate();
  var today = new Date().toISOString().slice(0,10);

  var h = '<div class="cal-nav">'
    + '<div class="cal-ym">'+calY+'년 '+MO[calM]+'</div>'
    + '<div class="cal-arrows">'
    + '<button class="cal-arrow" onclick="moveCal(-1)">‹</button>'
    + '<button class="cal-arrow" onclick="moveCal(1)">›</button>'
    + '</div></div>'
    + '<div class="cal-legend">'
    + '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>기승</div>'
    + '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>외승</div>'
    + '</div>'
    + '<div class="cal-grid">';

  DW.forEach(function(d) { h += '<div class="cal-dow">'+d+'</div>'; });
  for (var i=0; i<fd; i++) h += '<div></div>';

  for (var day=1; day<=dim; day++) {
    var ds = calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var es = byD[ds] || [];
    var isT = ds===today, isSel = ds===selDate, hasE = es.length>0;
    var dow = new Date(ds).getDay();
    var cls = 'cal-day'+(isT?' today':'')+(isSel?' selected':'')+(hasE?' has-entry':'')+(dow===0?' sun':dow===6?' sat':'');

    h += '<div class="'+cls+'" onclick="selDay(\''+ds+'\')">'
      + '<div class="cal-day-num">'+day+'</div>';

    if (hasE) {
      h += '<div class="cal-dots">';
      es.forEach(function(e) {
        var cls2 = e.type==='trail' ? 'cal-dot trail' : 'cal-dot ride';
        h += '<div class="'+cls2+'">'+ss(e.stable)+'</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  if (selDate) {
    var ses = byD[selDate] || [];
    h += '<div class="day-detail">'
      + '<div class="day-detail-hd">'
      + '<div class="day-detail-date">'+selDate.slice(5).replace('-','월 ')+'일</div>'
      + '<button class="day-add-btn" onclick="openNewEntry(\''+selDate+'\')">+ 추가</button>'
      + '</div>';
    if (ses.length) {
      ses.forEach(function(e) { h += makeEntryCard(e); });
    } else {
      h += '<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">이 날의 기록이 없어요</div><div class="empty-sub">+ 추가 버튼으로 기록을 남겨보세요</div></div>';
    }
    h += '</div>';
  }

  document.getElementById('pg-cal').innerHTML = h;
}

function moveCal(dir) {
  calM += dir;
  if (calM > 11) { calM = 0; calY++; }
  if (calM < 0) { calM = 11; calY--; }
  selDate = null;
  renderCal();
}
function selDay(ds) {
  selDate = (selDate === ds) ? null : ds;
  renderCal();
}

// ── ENTRY CARD ──
var BADGE_CLS = { '마장마술':'badge-dressage','장애물':'badge-jump','기본마술':'badge-basic','자격증':'badge-cert','외승':'badge-trail' };

function makeEntryCard(e) {
  var tags = extractTags((e.brief||'')+(e.detail||''));
  var weather = e.temp ? e.temp+'°C'+(e.hum?' · '+e.hum+'%':'') : '';
  var meta = [e.arena, e.gear, weather, e.coach?'코치: '+e.coach:''].filter(Boolean);
  var catLabel = e.type==='trail' ? '외승' : e.cat;
  var badgeCls = BADGE_CLS[catLabel] || 'badge-dressage';

  return '<div class="entry" id="entry-'+e.id+'">'
    + '<div class="entry-head" onclick="togEntry(\''+e.id+'\')">'
    + '<div class="entry-top">'
    + '<span class="entry-badge '+badgeCls+'">'+catLabel+'</span>'
    + '<span class="entry-date">'+e.date+(e.isTrip?' 🗺️':'')+'</span>'
    + '</div>'
    + '<div class="entry-stable">'+e.stable+'</div>'
    + (e.horse?'<div class="entry-horse">'+e.horse+'</div>':'')
    + (meta.length?'<div class="entry-meta">'+meta.map(function(t){return'<span class="entry-tag">'+t+'</span>';}).join('')+'</div>':'')
    + '<div class="entry-toggle" id="tog-'+e.id+'">펼치기 ▼</div>'
    + '</div>'
    + '<div class="entry-body" id="body-'+e.id+'">'
    + '<div class="entry-divider"></div>'
    + (e.brief?'<div class="entry-section"><div class="entry-section-label">📝 간단 메모</div><div class="entry-section-text">'+e.brief+'</div></div>':'')
    + (e.detail?'<div class="entry-section"><div class="entry-section-label">📖 상세 일지</div><div class="entry-section-text">'+e.detail+'</div></div>':'')
    + (tags.length?'<div class="entry-hashtags">'+tags.map(function(t){return'<span class="entry-hashtag">'+t+'</span>';}).join('')+'</div>':'')
    + '<button class="entry-del" onclick="confirmDelete(\''+e.id+'\',\''+e.stable+' · '+e.date+'\')">삭제</button>'
    + '</div>'
    + '</div>';
}

function togEntry(id) {
  var body = document.getElementById('body-'+id);
  var tog = document.getElementById('tog-'+id);
  if (!body) return;
  var open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  tog.textContent = open ? '펼치기 ▼' : '접기 ▲';
}

// ── JOURNAL ──
function renderJournal() {
  var cats = ['전체','마장마술','장애물','기본마술','자격증','외승'];
  var filtered = ENTRIES.filter(function(e) {
    if (jFilter==='전체') return true;
    if (jFilter==='외승') return e.type==='trail';
    return e.type==='ride' && e.cat===jFilter;
  }).slice().reverse();

  var h = '<div class="filter-bar">'
    + cats.map(function(c){return'<button class="filter-chip'+(c===jFilter?' on':'')+'" onclick="setJFilter(\''+c+'\')">'+c+'</button>';}).join('')
    + '</div>';

  if (!filtered.length) {
    h += '<div class="empty"><div class="empty-icon">🐴</div><div class="empty-title">아직 기록이 없어요</div><div class="empty-sub">첫 번째 기승 기록을 추가해보세요!</div></div>';
  } else {
    filtered.forEach(function(e){ h += makeEntryCard(e); });
  }
  document.getElementById('pg-journal').innerHTML = h;
}
function setJFilter(f) { jFilter=f; renderJournal(); }

// ── PASSES ──
function renderPasses() {
  var h = '';
  if (!PASSES.length) {
    h = '<div class="empty"><div class="empty-icon">🎫</div><div class="empty-title">등록된 이용권이 없어요</div><div class="empty-sub">10회권, 30회권 등을 등록해서 관리해보세요</div></div>';
  } else {
    PASSES.forEach(function(p) {
      var remain = p.remain;
      var pct = p.total ? Math.round(remain/p.total*100) : 0;
      var isLow = remain <= 3;
      var dd = dday(p.expiry);
      var per = (p.price && p.total) ? Math.round(p.price/p.total) : null;

      h += '<div class="pass-card '+(isLow?'pass-low':'')+'" style="border:1px solid '+(isLow?'rgba(255,59,48,0.3)':'var(--sep2)')+'">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'
        + '<div class="pass-stable">'+p.stable+'</div>'
        + '<div style="display:flex;gap:5px;flex-direction:column;align-items:flex-end">'
        + (isLow?'<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(255,59,48,0.08);color:var(--red)">잔여 부족</span>':'')
        + (dd!=null?'<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:'+(dd<=14?'rgba(255,59,48,0.08)':'var(--fill2)')+';color:'+(dd<=14?'var(--red)':'var(--label3)')+'">D-'+dd+'</span>':'')
        + '</div></div>'
        + '<div class="pass-counts">'
        + '<div class="pass-count remain"><div class="pass-count-num">'+remain+'</div><div class="pass-count-lbl">남은 횟수</div></div>'
        + '<div class="pass-count used"><div class="pass-count-num">'+(p.total-remain)+'</div><div class="pass-count-lbl">사용 횟수</div></div>'
        + '</div>'
        + '<div class="pass-info">'
        + (p.total?'<div class="pass-row"><span class="pass-row-lbl">총 횟수</span><span class="pass-row-val">'+p.total+'회</span></div>':'')
        + (p.purchase?'<div class="pass-row"><span class="pass-row-lbl">구매일</span><span class="pass-row-val">'+p.purchase+'</span></div>':'')
        + (p.expiry?'<div class="pass-row"><span class="pass-row-lbl">만료일</span><span class="pass-row-val">'+p.expiry+'</span></div>':'')
        + (p.price?'<div class="pass-row"><span class="pass-row-lbl">쿠폰 가격</span><span class="pass-row-val">'+fmt(p.price)+'</span></div>':'')
        + (per?'<div class="pass-row"><span class="pass-row-lbl">회당 가격</span><span class="pass-row-val">'+fmt(per)+'</span></div>':'')
        + '</div>'
        + '<div class="pass-bar"><div class="pass-bar-bg"><div class="pass-bar-fill" style="width:'+pct+'%"></div></div><div class="pass-bar-pct">'+pct+'% 남음</div></div>'
        + '</div>';
    });
  }
  h += '<button class="pass-add-btn" onclick="openPass()">+ 이용권 등록</button>';
  document.getElementById('pg-passes').innerHTML = '<div style="margin-top:8px">'+h+'</div>';
}

// ── STATS ──
function renderStats() {
  var years = [...new Set(ENTRIES.map(function(e){return(e.date||'').slice(0,4);}).filter(Boolean))].sort().reverse();
  var months = ['전체','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  var fd;
  if (statsFilter==='전체') fd=ENTRIES;
  else if (statsFilter.endsWith('년')) {
    var yr=statsFilter.replace('년','');
    fd=ENTRIES.filter(function(e){return(e.date||'').startsWith(yr);});
  } else {
    var curYr=new Date().getFullYear().toString();
    var mn=String(months.indexOf(statsFilter)).padStart(2,'0');
    fd=ENTRIES.filter(function(e){return(e.date||'').startsWith(curYr+'-'+mn);});
  }

  var rides=fd.filter(function(e){return e.type==='ride';}).length;
  var trails=fd.filter(function(e){return e.type==='trail';}).length;
  var totalMin=fd.reduce(function(a,e){return a+(parseInt(e.duration)||0);},0);
  var hr=Math.floor(totalMin/60),mn2=totalMin%60;
  var totalCost=0;
  fd.forEach(function(e){
    var p=PASSES.find(function(p){return p.stable===e.stable;});
    if(p&&p.price&&p.total)totalCost+=Math.round(p.price/p.total);
  });

  function mk(fn){var o={};fd.forEach(function(e){var k=fn(e);if(k)o[k]=(o[k]||0)+1;});return Object.entries(o).sort(function(a,b){return b[1]-a[1];});}
  function bar(items){
    if(!items.length)return'<div style="padding:12px;color:var(--label3);font-size:13px">데이터 없음</div>';
    var mx=items[0][1];
    return items.slice(0,6).map(function(x){
      return'<div class="bar-row"><span class="bar-lbl">'+x[0]+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+(x[1]/mx*100).toFixed(0)+'%"><span class="bar-num">'+x[1]+'</span></div></div></div>';
    }).join('');
  }

  var chips=['전체',...years.map(function(y){return y+'년';}),...months.slice(1).map(function(m){return m;})];

  var h='<div class="stats-filter">'
    +chips.map(function(c){return'<button class="stats-chip'+(c===statsFilter?' on':'')+'" onclick="setStats(\''+c+'\')">'+c+'</button>';}).join('')
    +'</div>'
    +'<div class="stats-grid">'
    +[['총 기승',rides+'회'],['외승',trails+'회'],['기승 시간',totalMin?(hr+'h '+mn2+'m'):'-'],['기승 비용',totalCost?fmt(totalCost):'-']].map(function(x){
      return'<div class="stat-card"><div class="stat-val">'+x[1]+'</div><div class="stat-lbl">'+x[0]+'</div></div>';
    }).join('')
    +'</div>';

  if(fd.length){
    h+='<div class="stats-sec-title">승마장별</div><div class="bar-card">'+bar(mk(function(e){return e.stable;}))+' </div>';
    h+='<div class="stats-sec-title">종목별</div><div class="bar-card">'+bar(mk(function(e){return e.type==='trail'?'외승':e.cat;}))+' </div>';
    if(statsFilter==='전체')h+='<div class="stats-sec-title">연도별</div><div class="bar-card">'+bar(mk(function(e){return(e.date||'').slice(0,4);}))+'</div>';
  } else {
    h+='<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">기록을 추가하면 통계가 나타나요</div></div>';
  }
  document.getElementById('pg-stats').innerHTML=h;
}
function setStats(f){statsFilter=f;renderStats();}

// ── SEARCH ──
var ALL_TAGS = [];
function getAllTags() {
  var tags={};
  ENTRIES.forEach(function(e){
    extractTags((e.brief||'')+(e.detail||'')).forEach(function(t){tags[t]=(tags[t]||0)+1;});
  });
  return Object.entries(tags).sort(function(a,b){return b[1]-a[1];}).map(function(x){return x[0];});
}

function doSearch() {
  var q = document.getElementById('search-q').value.trim();
  var sugEl = document.getElementById('search-suggestions');
  var resEl = document.getElementById('search-results');

  if (!q) { sugEl.style.display='none'; resEl.innerHTML=''; return; }

  // 자동완성 (해시태그)
  if (q.startsWith('#') || (!q.includes(' ') && q.length<=10)) {
    var partial = q.startsWith('#') ? q : '#'+q;
    var tags = getAllTags().filter(function(t){return t.startsWith(partial)||t.slice(1).startsWith(q);});
    if (tags.length && q.length>=1) {
      sugEl.style.display='block';
      sugEl.innerHTML=tags.slice(0,6).map(function(t){
        return'<div class="search-sug-item" onclick="setSearchQ(\''+t+'\')"><span class="search-sug-tag">'+t+'</span></div>';
      }).join('');
    } else sugEl.style.display='none';
  } else sugEl.style.display='none';

  // 검색 결과
  var r = ENTRIES.filter(function(e){
    var full=(e.stable||'')+(e.horse||'')+(e.coach||'')+(e.brief||'')+(e.detail||'')+(e.cat||'');
    return full.includes(q);
  }).slice().reverse();

  if (!r.length) {
    resEl.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">검색 결과 없음</div></div>';
  } else {
    resEl.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--label3);margin-bottom:10px">'+r.length+'개</div>'+r.map(makeEntryCard).join('');
  }
}
function setSearchQ(t){document.getElementById('search-q').value=t;document.getElementById('search-suggestions').style.display='none';doSearch();}

// ── NEW ENTRY ──
function openNewEntry(date) {
  document.getElementById('f-date').value = date || new Date().toISOString().slice(0,10);
  document.getElementById('f-horse').value='';
  document.getElementById('f-coach').value='';
  document.getElementById('f-gear').value='';
  document.getElementById('f-temp').value='';
  document.getElementById('f-hum').value='';
  document.getElementById('f-brief').value='';
  document.getElementById('f-detail').value='';
  setType('ride'); setCat('마장마술'); setArena('실내'); setTrip(false);
  updateStableDropdown();
  document.getElementById('entryModal').className='modal-bg on';
}
function closeEntry(){document.getElementById('entryModal').className='modal-bg';}

function updateStableDropdown(){
  var sel=document.getElementById('f-stable');
  var prev=sel.value;
  sel.innerHTML='<option value="">승마장 선택</option>';
  PASSES.forEach(function(p){
    sel.innerHTML+='<option value="'+p.stable+'">'+p.stable+'</option>';
  });
  if(PASSES.length) sel.innerHTML+='<option value="__other__">직접 입력</option>';
  if(prev)sel.value=prev;
  updatePassPreview();
}

function updatePassPreview(){
  var stable=document.getElementById('f-stable').value;
  var p=PASSES.find(function(x){return x.stable===stable;});
  var el=document.getElementById('pass-preview');
  if(p){el.style.display='block';el.style.color=p.remain<=3?'var(--red)':'var(--label2)';el.textContent='기승권 '+p.remain+'회 남음';}
  else el.style.display='none';
}

function setType(t){
  fType=t;
  document.querySelectorAll('#type-btns .form-sel').forEach(function(b,i){b.className='form-sel'+(i===(t==='ride'?0:1)?' on':'');});
  document.getElementById('category-sec').style.display=t==='trail'?'none':'block';
}
function setCat(c){
  fCat=c;
  document.querySelectorAll('#cat-btns .form-sel').forEach(function(b){
    b.className='form-sel'+(b.textContent===c?' on':'');
  });
}
function setArena(a){
  fArena=a;
  document.querySelectorAll('.form-sel-duo .form-sel').forEach(function(b){
    if(b.textContent==='실내'||b.textContent==='야외') b.className='form-sel'+(b.textContent===a?' on':'');
  });
}
function setTrip(v){
  fTrip=v;
  document.querySelectorAll('.form-sel-duo .form-sel').forEach(function(b){
    if(b.textContent==='정기'||b.textContent==='원정') b.className='form-sel'+((!v&&b.textContent==='정기')||(v&&b.textContent==='원정')?' on':'');
  });
}

function saveEntry(){
  var stable=document.getElementById('f-stable').value;
  if(stable==='__other__'){stable=prompt('승마장 이름을 입력하세요')||'';} 
  if(!stable){alert('승마장을 선택해주세요');return;}
  var e={
    id:uid(),
    date:document.getElementById('f-date').value,
    type:fType,
    stable:stable,
    horse:document.getElementById('f-horse').value.trim(),
    coach:document.getElementById('f-coach').value.trim(),
    cat:fType==='trail'?'외승':fCat,
    arena:fArena,
    isTrip:fTrip,
    gear:document.getElementById('f-gear').value.trim(),
    temp:document.getElementById('f-temp').value,
    hum:document.getElementById('f-hum').value,
    brief:document.getElementById('f-brief').value.trim(),
    detail:document.getElementById('f-detail').value.trim(),
  };
  if(!e.date){alert('날짜를 입력해주세요');return;}
  ENTRIES.push(e);
  ENTRIES.sort(function(a,b){return a.date<b.date?-1:1;});
  // 기승권 차감
  var p=PASSES.find(function(x){return x.stable===stable;});
  if(p&&p.remain>0)p.remain--;
  save();
  closeEntry();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
}

// ── PASS ──
function openPass(){
  document.getElementById('p-stable').value='';
  document.getElementById('p-remain').value='';
  document.getElementById('p-purchase').value='';
  document.getElementById('p-expiry').value='';
  document.getElementById('p-price').value='';
  document.getElementById('p-count-custom').style.display='none';
  setPCount(10);
  document.getElementById('passModal').className='modal-bg on';
}
function closePass(){document.getElementById('passModal').className='modal-bg';}

function setPCount(n){
  pCount=n;
  document.querySelectorAll('#p-count-opts .form-sel').forEach(function(b){
    var v=parseInt(b.textContent)||(-1);
    b.className='form-sel'+(v===n?' on':'');
  });
  document.getElementById('p-count-custom').style.display=(n===-1)?'block':'none';
}

function savePass(){
  var stable=document.getElementById('p-stable').value.trim();
  if(!stable){alert('승마장명을 입력해주세요');return;}
  var total=pCount===-1?parseInt(document.getElementById('p-count-custom').value)||0:pCount;
  var remain=parseInt(document.getElementById('p-remain').value)||total;
  var p={
    id:uid(),stable,total,remain,
    purchase:document.getElementById('p-purchase').value,
    expiry:document.getElementById('p-expiry').value,
    price:parseInt(document.getElementById('p-price').value)||0
  };
  PASSES.push(p);
  save();
  closePass();
  renderPasses();
}

// ── DELETE ──
function confirmDelete(id,label){
  deleteId=id;
  document.getElementById('confirm-sub').textContent=label+'\n이 기록을 삭제할까요? 복구할 수 없어요.';
  document.getElementById('confirmModal').className='confirm-bg on';
}
function closeConfirm(){document.getElementById('confirmModal').className='confirm-bg';deleteId=null;}
function doDelete(){
  if(!deleteId)return;
  ENTRIES=ENTRIES.filter(function(e){return e.id!==deleteId;});
  save();closeConfirm();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  if(curTab==='search')doSearch();
  var el=document.getElementById('entry-'+deleteId);
  if(el)el.remove();
}

function sbFetch(path, opts) {
  return fetch(SB_URL + '/rest/v1/' + path, Object.assign({
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    }
  }, opts));
}

function sbLoadEntries() {
  return sbFetch('entries?order=date.asc')
    .then(function(r){return r.json();})
    .then(function(data){
      if(Array.isArray(data)) ENTRIES = data.map(function(e){return Object.assign(e,{isTrip:e.is_trip});});
    })
    .catch(function(err){console.error('Supabase load error:',err);});
}

function sbSaveEntry(e) {
  var row = {
    date:e.date, type:e.type, stable:e.stable, horse:e.horse,
    coach:e.coach, cat:e.cat, arena:e.arena, is_trip:e.isTrip,
    gear:e.gear, temp:e.temp, hum:e.hum, brief:e.brief, detail:e.detail
  };
  return sbFetch('entries', {method:'POST', body:JSON.stringify(row)})
    .then(function(r){return r.json();})
    .then(function(data){if(Array.isArray(data)&&data[0])e.id=data[0].id;})
    .catch(function(err){console.error('Supabase save error:',err);});
}

function sbDeleteEntry(id) {
  return sbFetch('entries?id=eq.'+id, {method:'DELETE'})
    .catch(function(err){console.error('Supabase delete error:',err);});
}

  try{localStorage.setItem('eq_passes',JSON.stringify(PASSES));}catch(e){}
}

function load(){

}
