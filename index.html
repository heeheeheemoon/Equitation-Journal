<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Equitation Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{
  --bg:#F2EBE0;--card:#FFFDF8;--card2:#FDF6EC;
  --br:#5C3D1E;--br2:#8B5E3C;--br3:#C4956A;--br4:#E8D5B7;--br5:#F5EDE0;
  --sep:rgba(92,61,30,0.18);--sep2:rgba(92,61,30,0.1);
  --tx:#1E0E04;--tx2:rgba(30,14,4,0.65);--tx3:rgba(30,14,4,0.38);
  --green:#1E7A45;--greenL:rgba(30,122,69,0.1);
  --red:#B83020;--redL:rgba(184,48,32,0.1);
  --purple:#6B2FA0;--purpleL:rgba(107,47,160,0.1);
  --pink:#B84070;--pinkL:rgba(184,64,112,0.1);
  --blue:#1A5294;--blueL:rgba(26,82,148,0.1);
  --orange:#A84010;--orangeL:rgba(168,64,16,0.1);
  --gray:rgba(30,14,4,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--tx)}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;background:linear-gradient(160deg,#2A1005 0%,#4A2E12 45%,#7A5030 100%)}
.login-logo{font-size:60px;margin-bottom:18px}
.login-title{font-size:34px;font-weight:900;color:#FFF8F0;letter-spacing:-1px;margin-bottom:3px}
.login-sub{font-size:12px;color:rgba(255,248,240,0.45);margin-bottom:44px;letter-spacing:2.5px;text-transform:uppercase}
.google-btn{display:flex;align-items:center;gap:12px;background:#FFF8F0;border-radius:14px;padding:14px 28px;font-size:15px;font-weight:700;color:#2A1005;box-shadow:0 4px 24px rgba(0,0,0,0.25)}
.google-btn svg{width:20px;height:20px;flex-shrink:0}

/* HEADER */
.hd{background:rgba(42,16,5,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:48px 20px 13px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(196,149,106,0.2)}
.hd-inner{display:flex;justify-content:space-between;align-items:flex-end}
.hd-label{font-size:10px;font-weight:600;color:rgba(196,149,106,0.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.hd-title{font-size:24px;font-weight:800;color:#FFF8F0;letter-spacing:-.6px;line-height:1}
.hd-right{display:flex;gap:7px;align-items:center}
.hd-add{background:rgba(196,149,106,0.18);border:1px solid rgba(196,149,106,0.3);border-radius:18px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--br3)}
.hd-avatar{width:29px;height:29px;border-radius:50%;border:1.5px solid rgba(196,149,106,0.35);overflow:hidden;cursor:pointer;background:var(--br2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.hd-avatar img{width:100%;height:100%;object-fit:cover}

/* TABS */
.tabs{display:flex;background:rgba(38,14,4,0.97);backdrop-filter:blur(16px);position:sticky;top:89px;z-index:99;border-bottom:1px solid rgba(196,149,106,0.15);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:10px 2px;font-size:10px;font-weight:600;color:rgba(196,149,106,0.35);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center;white-space:nowrap;letter-spacing:.8px;text-transform:uppercase}
.tab.on{color:var(--br3);border-bottom-color:var(--br3);font-weight:800}

.ct{padding:14px;padding-bottom:100px}
.dn{display:none}

/* ENTRY CARD */
.ec{background:var(--card);border-radius:13px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 5px rgba(92,61,30,0.09);border:1px solid var(--sep2)}
.ec.open{border-color:rgba(139,94,60,0.35)}
.ec-future{opacity:.5}
.ec-head{padding:12px 13px;cursor:pointer}
.ec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:7px}
.ec-badges{display:flex;gap:3px;flex-wrap:wrap;align-items:center;flex:1}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:18px;letter-spacing:.1px}
.badge-마장마술{background:var(--purpleL);color:var(--purple)}
.badge-기본마술{background:var(--blueL);color:var(--blue)}
.badge-장애물{background:var(--orangeL);color:var(--orange)}
.badge-자격증{background:var(--greenL);color:var(--green)}
.badge-외승{background:var(--pinkL);color:var(--pink)}
.badge-미분류{background:rgba(30,14,4,0.06);color:var(--tx3)}
.badge-fall{background:var(--redL);color:var(--red)}
.badge-future{background:rgba(30,14,4,0.05);color:var(--tx3);border:1px dashed var(--sep)}
.ec-top-right{display:flex;gap:5px;align-items:center;flex-shrink:0}
.ec-act-btn{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px}
.ec-act-edit{background:var(--br5);border:1px solid var(--sep);color:var(--br2)}
.ec-act-del{background:var(--redL);border:1px solid rgba(184,48,32,0.2);color:var(--red)}
.ec-title{font-size:16px;font-weight:900;color:var(--tx);letter-spacing:-.5px;margin-bottom:2px;line-height:1.2}
.ec-sub{font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.ec-meta{display:flex;gap:4px;flex-wrap:wrap}
.ec-meta-tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:7px;background:var(--br5);color:var(--tx2);border:1px solid var(--sep2)}
.ec-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.ec-body.open{max-height:3000px}
.ec-body-inner{border-top:1px solid var(--sep2);padding:11px 13px}
.ec-section{margin-bottom:10px}
.ec-section-label{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px}
.ec-section-text{font-size:13px;color:var(--tx);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ec-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.ec-tag{font-size:11px;font-weight:600;color:var(--br2)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px}
.cal-ym{font-size:19px;font-weight:900;color:var(--tx);letter-spacing:-.5px}
.cal-arrows{display:flex;gap:5px;align-items:center}
.cal-arrow{background:var(--card);border:1px solid var(--sep);border-radius:7px;width:29px;height:29px;font-size:14px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.cal-today-btn{background:var(--br);border-radius:7px;padding:5px 9px;font-size:10px;font-weight:700;color:#fff;letter-spacing:.3px}
.cal-legend{display:flex;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.cal-legend-item{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--tx3)}
.cal-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:9px;font-weight:700;color:var(--tx3);padding:4px 0;letter-spacing:.3px}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-day{min-height:52px;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;cursor:pointer;border:1px solid var(--sep2);background:rgba(255,253,248,0.4);transition:border-color .1s}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-day.has-entry{background:var(--card);border-color:var(--sep);box-shadow:0 1px 3px rgba(92,61,30,0.07)}
.cal-day.today{border-color:var(--br2)!important;background:rgba(139,94,60,0.06)!important}
.cal-day.selected{border-color:var(--br)!important;border-width:1.5px!important}
.cal-day.blocked{background:rgba(30,14,4,0.06);border-color:var(--sep2)}
.cal-day-num{font-size:10px;font-weight:700;padding:3px 0 1px;color:var(--tx);text-align:center}
.cal-day.today .cal-day-num{color:var(--br);font-weight:900}
.cal-day.sun .cal-day-num,.cal-day.holiday .cal-day-num{color:var(--red)}
.cal-day.sat .cal-day-num{color:var(--blue)}
.cal-day.blocked .cal-day-num{color:var(--tx3)}
.cal-entry-row{display:flex;align-items:center;gap:2px;padding:1px 3px}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-dot.lesson{background:var(--purple)}
.cal-dot.trail{background:var(--green)}
.cal-dot.future{background:var(--tx3)}
.cal-dot.fall{background:var(--red)}
.cal-entry-text{font-size:8px;font-weight:600;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;line-height:1.3}
.cal-blocked-label{font-size:8px;color:var(--tx3);text-align:center;padding:2px 3px;line-height:1.2}
.day-detail{margin-top:13px;padding-top:13px;border-top:2px solid var(--br4)}
.day-detail-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.day-date-big{font-size:17px;font-weight:900;color:var(--tx);letter-spacing:-.4px}
.day-add-btn{background:var(--br);border-radius:17px;padding:6px 13px;font-size:12px;font-weight:700;color:#fff}

/* PASSES */
.pass-group-label{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.pass-group-label::after{content:'';flex:1;height:1px;background:var(--sep)}
.pass-card{background:var(--card);border-radius:11px;padding:11px 12px;margin-bottom:6px;border:1px solid var(--sep2);box-shadow:0 1px 4px rgba(92,61,30,0.06)}
.pass-card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.pass-name{font-size:13px;font-weight:800;color:var(--tx)}
.pass-tag{font-size:9px;font-weight:700;color:var(--br3);background:rgba(196,149,106,0.12);border-radius:5px;padding:1px 5px;margin-left:4px}
.pass-info-compact{display:flex;gap:10px;font-size:11px;color:var(--tx2);margin-bottom:6px;flex-wrap:wrap}
.pass-info-compact span{display:flex;gap:3px;align-items:center}
.pass-info-compact b{color:var(--tx);font-weight:700}
.pass-remain-big{font-size:22px;font-weight:900;color:var(--green);letter-spacing:-1px}
.pass-remain-big.low{color:var(--red)}
.pass-remain-big.done{color:var(--tx3)}
.pass-bar-bg{height:3px;background:var(--br4);border-radius:2px;overflow:hidden;margin-top:5px}
.pass-bar-fill{height:100%;border-radius:2px;background:var(--green)}
.pass-status{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px}
.pass-status.low{background:var(--redL);color:var(--red)}
.pass-status.done{background:rgba(30,14,4,0.06);color:var(--tx3)}
.pass-status.ok{background:var(--greenL);color:var(--green)}
.pass-act-row{display:flex;gap:5px}
.pass-act-btn{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700}
.pass-act-edit{background:var(--br5);border:1px solid var(--sep);color:var(--br2)}
.pass-act-del{background:var(--redL);border:1px solid rgba(184,48,32,0.2);color:var(--red)}
.pass-add-btn{width:100%;padding:11px;background:var(--card);border:1.5px dashed var(--sep);border-radius:10px;font-size:13px;font-weight:600;color:var(--tx3)}
.pass-section-done{margin-top:6px}
.pass-done-toggle{font-size:11px;font-weight:600;color:var(--tx3);padding:8px;text-align:center;cursor:pointer;background:var(--br5);border-radius:8px;border:1px solid var(--sep2)}

/* STATS */
.stats-year-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:13px}
.stats-year-tabs::-webkit-scrollbar{display:none}
.stats-year-tab{flex-shrink:0;padding:5px 14px;border-radius:17px;border:1px solid var(--sep);background:var(--card);font-size:11px;font-weight:700;color:var(--tx2)}
.stats-year-tab.on{background:var(--br);border-color:var(--br);color:#fff}
.stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.stats-card{background:var(--card);border-radius:11px;padding:12px;border:1px solid var(--sep2)}
.stats-val{font-size:22px;font-weight:900;color:var(--br);letter-spacing:-1px;line-height:1;margin-bottom:3px}
.stats-lbl{font-size:9px;font-weight:700;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase}
.stats-month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.stats-month-card{background:var(--card);border-radius:8px;padding:7px;border:1px solid var(--sep2);text-align:center}
.stats-month-num{font-size:9px;font-weight:700;color:var(--tx3);margin-bottom:2px}
.stats-month-val{font-size:14px;font-weight:900;color:var(--tx);letter-spacing:-.3px}
.stats-sec-title{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.stats-sec-title::after{content:'';flex:1;height:1px;background:var(--sep)}
.bar-card{background:var(--card);border-radius:10px;padding:10px;margin-bottom:9px;border:1px solid var(--sep2)}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-lbl{font-size:10px;font-weight:600;color:var(--tx2);width:56px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:12px;background:var(--br5);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--br2);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;min-width:16px}
.bar-num{font-size:8px;color:#fff;font-weight:800}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:10px 13px 10px 38px;background:var(--card);border:1px solid var(--sep);border-radius:10px;font-size:14px;color:var(--tx);outline:none}
.search-input:focus{border-color:var(--br2)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.search-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.search-tag{padding:3px 10px;border-radius:17px;background:var(--card);border:1px solid var(--sep);font-size:11px;font-weight:600;color:var(--br2)}

/* FILTER */
.filter-bar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px;padding-bottom:2px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 11px;border-radius:17px;border:1px solid var(--sep);background:var(--card);font-size:11px;font-weight:600;color:var(--tx2)}
.filter-chip.on{background:var(--br);border-color:var(--br);color:#fff}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,6,0,0.6);z-index:300;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:var(--bg);width:100%;max-height:93vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{padding:13px 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(242,235,224,0.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--sep);z-index:1}
.modal-title{font-size:16px;font-weight:800;color:var(--tx);letter-spacing:-.3px}
.modal-close{background:var(--br4);border-radius:50%;width:27px;height:27px;font-size:13px;font-weight:700;color:var(--br2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:13px 13px 34px}

/* FORM */
.form-row{display:grid;gap:8px;margin-bottom:8px}
.form-row.col2{grid-template-columns:1fr 1fr}
.form-row.col3{grid-template-columns:1fr 1fr 1fr}
.form-lbl{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input{width:100%;padding:8px 10px;background:var(--card);border:1px solid var(--sep);border-radius:8px;font-size:13px;color:var(--tx);outline:none}
.form-input:focus{border-color:var(--br2)}
.form-textarea{width:100%;padding:9px 10px;background:var(--card);border:1px solid var(--sep);border-radius:8px;font-size:13px;color:var(--tx);outline:none;resize:vertical;line-height:1.7;min-height:80px}
.form-textarea:focus{border-color:var(--br2)}
.form-select{width:100%;padding:8px 10px;background:var(--card);border:1px solid var(--sep);border-radius:8px;font-size:13px;color:var(--tx);outline:none;appearance:none;-webkit-appearance:none}
.form-section{background:var(--card);border-radius:11px;padding:11px;margin-bottom:8px;border:1px solid var(--sep2)}
.form-section-title{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px}
.form-chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:17px;border:1px solid var(--sep);background:var(--br5);font-size:12px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--br);border-color:var(--br);color:#fff}
.chip-duo{display:flex;gap:6px}
.chip-duo .chip{flex:1;text-align:center}
.form-check-row{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--redL);border:1px solid rgba(184,48,32,0.2);border-radius:8px;cursor:pointer}
.form-check-row input{width:16px;height:16px;accent-color:var(--red)}
.form-check-lbl{font-size:12px;font-weight:700;color:var(--red)}
/* 자동완성 */
.autocomplete-list{position:absolute;left:0;right:0;background:var(--card);border:1px solid var(--sep);border-radius:0 0 8px 8px;box-shadow:0 4px 12px rgba(92,61,30,0.12);z-index:10;max-height:160px;overflow-y:auto}
.autocomplete-item{padding:9px 12px;font-size:13px;color:var(--tx);cursor:pointer;border-bottom:1px solid var(--sep2)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover,.autocomplete-item:active{background:var(--br5)}
.autocomplete-wrap{position:relative}
/* 저장 버튼 고정 */
.save-btn-wrap{position:sticky;bottom:0;padding:10px 0 0;background:var(--bg)}
.save-btn{width:100%;padding:13px;background:var(--br);border-radius:11px;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px}
.ai-btn{width:100%;padding:8px;background:linear-gradient(135deg,#3A1470,#6B2FA0);border-radius:8px;font-size:11px;font-weight:700;color:#fff;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px}

/* CONFIRM */
.confirm-bg{display:none;position:fixed;inset:0;background:rgba(20,6,0,0.6);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.confirm-bg.on{display:flex}
.confirm-box{background:var(--card);border-radius:16px;width:100%;max-width:275px;overflow:hidden;box-shadow:0 16px 48px rgba(92,61,30,0.2)}
.confirm-body{padding:18px;text-align:center}
.confirm-title{font-size:16px;font-weight:800;margin-bottom:5px;color:var(--tx)}
.confirm-sub{font-size:12px;color:var(--tx2);line-height:1.5}
.confirm-btns{display:flex;border-top:1px solid var(--sep)}
.confirm-btn{flex:1;padding:13px;font-size:16px}
.confirm-btn.cancel{color:var(--br2);font-weight:500;border-right:1px solid var(--sep)}
.confirm-btn.del{color:var(--red);font-weight:700}

/* BLOCKED MODAL */
.block-modal{background:var(--bg);width:100%;max-height:50vh;border-radius:20px 20px 0 0;animation:slideUp .25s cubic-bezier(.32,.72,0,1)}

/* MISC */
.empty{text-align:center;padding:44px 20px}
.empty-icon{font-size:38px;margin-bottom:9px}
.empty-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px}
.empty-sub{font-size:12px;color:var(--tx3);line-height:1.5}
.import-banner{background:linear-gradient(135deg,var(--br),var(--br2));border-radius:12px;padding:13px;margin-bottom:12px;color:#fff}
.import-banner-title{font-size:13px;font-weight:800;margin-bottom:2px}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){return n!=null?Number(n).toLocaleString()+'원':'-';}
function ss(s){if(!s)return'';var m={'에이스승마랜드':'에이스','노바스테이블스':'노바','정철희국제승마센터천안점':'정철희','홀스메이트':'홀스','소노승마':'소노','비스타밸리승마':'비스타','TK승마(안산)':'TK안산','TK승마(분당)':'TK분당','TK승마':'TK','양주승마':'양주','유니콘승마':'유니콘','워너비승마':'워너비','세인트이콰인':'세인트','힐링승마':'힐링'};return m[s]||s.slice(0,4);}
function extractTags(t){if(!t)return[];var m=t.match(/#[\w가-힣]+/g);return m?[...new Set(m)]:[]; }
function dday(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000);}
function fmtDate(d){if(!d)return'';var w=['일','월','화','수','목','금','토'];var dt=new Date(d+'T00:00:00');return d.slice(5).replace('-','.')+'('+w[dt.getDay()]+')'; }
function isFuture(d){return d>TODAY;}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function getHorses(){return [...new Set(ENTRIES.map(function(e){return e.horse;}).filter(Boolean))].sort();}
function getCoaches(){return [...new Set(ENTRIES.map(function(e){return e.coach;}).filter(Boolean))].sort();}

function setupAutocomplete(inputId, getItems){
  var inp=document.getElementById(inputId);
  if(!inp)return;
  var wrap=inp.parentElement;
  if(!wrap.classList.contains('autocomplete-wrap')){inp.outerHTML='<div class="autocomplete-wrap">'+inp.outerHTML+'</div>';inp=wrap.querySelector('#'+inputId);}
  inp.addEventListener('input',function(){showAC(inp,getItems());});
  inp.addEventListener('blur',function(){setTimeout(function(){var l=inp.parentElement.querySelector('.autocomplete-list');if(l)l.remove();},150);});
}
function showAC(inp,items){
  var wrap=inp.closest('.autocomplete-wrap')||inp.parentElement;
  var old=wrap.querySelector('.autocomplete-list');if(old)old.remove();
  var q=inp.value.toLowerCase();
  if(!q)return;
  var filtered=items.filter(function(x){return x.toLowerCase().includes(q);}).slice(0,6);
  if(!filtered.length)return;
  var ul=document.createElement('div');ul.className='autocomplete-list';
  filtered.forEach(function(item){
    var li=document.createElement('div');li.className='autocomplete-item';li.textContent=item;
    li.addEventListener('mousedown',function(){inp.value=item;var l=wrap.querySelector('.autocomplete-list');if(l)l.remove();inp.dispatchEvent(new Event('change'));updatePassPreview();});
    ul.appendChild(li);
  });
  wrap.style.position='relative';wrap.appendChild(ul);
}

// AUTH
async function signInGoogle(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});}
function showUserMenu(){if(confirm((curUser?.email||'')+'\n\n로그아웃 하시겠어요?'))sb.auth.signOut().then(function(){location.reload();});}

// DATA
async function loadData(){
  var[eR,pR]=await Promise.all([
    sb.from('entries').select('*').eq('user_id',curUser.id).order('date',{ascending:true}),
    sb.from('passes').select('*').eq('user_id',curUser.id).order('purchase',{ascending:true})
  ]);
  ENTRIES=(eR.data||[]).map(function(e){return Object.assign({},e,{isTrip:e.is_trip});});
  PASSES=pR.data||[];
  // blocked 날짜 로컬 스토리지
  try{var b=localStorage.getItem('blocked_'+curUser.id);if(b)BLOCKED=JSON.parse(b);}catch(e){}
}
async function sbAdd(table,row){var{data,error}=await sb.from(table).insert(row).select();if(error){console.error(error);return null;}return data&&data[0];}
async function sbUpdate(table,id,row){await sb.from(table).update(row).eq('id',id);}
async function sbDelete(table,id){await sb.from(table).delete().eq('id',id);}

// INIT
sb.auth.onAuthStateChange(async function(event,session){

    curUser=session.user;

    await loadData();renderCal();
  } else {
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
  }
});

// NAV
function onAddBtn(){if(curTab==='passes')openNewPass();else openNewEntry();}

  curTab=t;

  document.getElementById('page-title').textContent=titles[t];
  if(t==='cal')renderCal();
  if(t==='journal')renderJournal();
  if(t==='passes')renderPasses();

}

// ENTRY CARD
function catBadge(e){var cat=e.type==='trail'?'외승':(e.cat||'미분류');return '<span class="badge badge-'+cat+'">'+cat+'</span>';}
function makeEntryCard(e){
  var future=isFuture(e.date);
  var tags=extractTags((e.brief||'')+(e.detail||''));
  var meta=[e.saddle?'안장 '+e.saddle:'',e.rein?'레인 '+e.rein:'',e.coach||'',e.duration?e.duration+'min':'',e.weather||'',e.temp?e.temp+'°C':''].filter(Boolean);
  // 제목: num. 승마장명 (잔여쿠폰)
  var pass=PASSES.find(function(p){return p.stable===e.stable&&p.remain>0;});
  var titleStr=(e.num&&e.num<9999?Math.floor(e.num)+'. ':'')+e.stable+(pass?' ('+pass.remain+')':'');
  return '<div class="ec'+(future?' ec-future':'')+'" id="ec-'+e.id+'">'
    +'<div class="ec-head" onclick="togEC(\''+e.id+'\')">'
    +'<div class="ec-top"><div class="ec-badges">'+catBadge(e)+(e.is_fall?'<span class="badge badge-fall">⚠️ 낙마</span>':'')+(future?'<span class="badge badge-future">예정</span>':'')+'</div>'
    +'<div class="ec-top-right"><button class="ec-act-btn ec-act-edit" onclick="event.stopPropagation();openEditEntry(\''+e.id+'\')">수정</button><button class="ec-act-btn ec-act-del" onclick="event.stopPropagation();confirmDelete(\'entry\',\''+e.id+'\',\''+e.stable+' '+fmtDate(e.date)+'\')">삭제</button></div></div>'
    +'<div class="ec-title">'+titleStr+'</div>'
    +(e.horse?'<div class="ec-sub">'+e.horse+(e.horse_type?' · '+e.horse_type:'')+'</div>':'')
    +(meta.length?'<div class="ec-meta">'+meta.map(function(t){return'<span class="ec-meta-tag">'+t+'</span>';}).join('')+'</div>':'')
    +'</div>'
    +'<div class="ec-body" id="body-'+e.id+'">'
    +'<div class="ec-body-inner">'
    +(e.brief?'<div class="ec-section"><div class="ec-section-label">간단 메모</div><div class="ec-section-text">'+e.brief+'</div></div>':'')
    +(e.detail?'<div class="ec-section"><div class="ec-section-label">상세 일지</div><div class="ec-section-text">'+e.detail+'</div></div>':'')
    +(tags.length?'<div class="ec-tags">'+tags.map(function(t){return'<span class="ec-tag">'+t+'</span>';}).join('')+'</div>':'')
    +'</div></div></div>';
}
function togEC(id){var body=document.getElementById('body-'+id);var ec=document.getElementById('ec-'+id);if(!body)return;var open=body.classList.contains('open');body.classList.toggle('open',!open);ec.classList.toggle('open',!open);}

// CALENDAR
var longPressTimer=null;
function renderCal(){
  var byD={};
  ENTRIES.forEach(function(e){if(e.date){if(!byD[e.date])byD[e.date]=[];byD[e.date].push(e);}});
  var fd=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var h='<div class="cal-nav">'
    +'<button class="cal-arrow" onclick="moveCal(-1)">‹</button>'
    +'<div style="display:flex;align-items:center;gap:8px"><span class="cal-ym">'+calY+'년 '+MO[calM]+'</span><button class="cal-today-btn" onclick="goToday()">오늘</button></div>'
    +'<button class="cal-arrow" onclick="moveCal(1)">›</button></div>'
    +'<div class="cal-legend">'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>레슨</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>외승</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--tx3)"></div>예정</div>'
    +'<div class="cal-legend-item">⚠️ 낙마</div>'
    +'</div><div class="cal-grid">';
  DW.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div class="cal-day empty"></div>';
  for(var day=1;day<=dim;day++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var es=byD[ds]||[];
    var isT=ds===TODAY,isSel=ds===selDate,hasE=es.length>0;
    var isBlocked=!!BLOCKED[ds];
    var dow=new Date(ds+'T00:00:00').getDay();
    var mmdd=String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isHol=!!HOLIDAYS[mmdd];
    var cls=['cal-day'];
    if(hasE)cls.push('has-entry');
    if(isT)cls.push('today');
    if(isSel)cls.push('selected');
    if(isBlocked)cls.push('blocked');
    if(dow===0||isHol)cls.push('sun');
    else if(dow===6)cls.push('sat');
    var ontouch='onlongpress(\''+ds+'\')';
    h+='<div class="'+cls.join(' ')+'" onclick="selDay(\''+ds+'\')" oncontextmenu="event.preventDefault();openBlock(\''+ds+'\')" id="day-'+ds+'">'
      +'<div class="cal-day-num">'+day+'</div>';
    if(isBlocked&&!hasE){h+='<div class="cal-blocked-label">'+((BLOCKED[ds]&&BLOCKED[ds].reason)||'–')+'</div>';}
    if(hasE){
      es.forEach(function(e){
        var future=isFuture(e.date);
        var dotCls=future?'future':e.type==='trail'?'trail':'lesson';
        var pass=PASSES.find(function(p){return p.stable===e.stable&&p.remain>0;});
        var passInfo=pass?'('+pass.remain+')':'';
        h+='<div class="cal-entry-row"><div class="cal-dot '+dotCls+'"></div>'
          +'<div class="cal-entry-text">'+ss(e.stable)+passInfo+(e.is_fall?' ⚠️':'')+'</div></div>';
      });
    }
    h+='</div>';
  }
  h+='</div>';
  if(selDate){
    var ses=byD[selDate]||[];
    h+='<div class="day-detail"><div class="day-detail-hd"><div class="day-date-big">'+fmtDate(selDate)+'</div><button class="day-add-btn" onclick="openNewEntry(\''+selDate+'\')">+ 추가</button></div>';
    if(ses.length)ses.forEach(function(e){h+=makeEntryCard(e);});
    else h+='<div class="empty" style="padding:20px"><div class="empty-icon">📝</div><div class="empty-title">기록 없음</div></div>';
    h+='</div>';
  }
  if(ENTRIES.length===0){h='<div class="import-banner"><div class="import-banner-title">📥 기존 데이터 불러오기</div><div class="import-banner-sub">구글 캘린더 기승 기록 323개</div><button class="import-btn" onclick="importData()">임포트 시작</button></div>'+h;}
  document.getElementById('pg-cal').innerHTML=h;
}
function moveCal(dir){calM+=dir;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}selDate=null;renderCal();}
function selDay(ds){selDate=(selDate===ds)?null:ds;renderCal();}
function goToday(){calY=new Date().getFullYear();calM=new Date().getMonth();selDate=TODAY;renderCal();}

// 날짜 차단
function openBlock(ds){blockDate=ds;document.getElementById('block-reason').value=(BLOCKED[ds]&&BLOCKED[ds].reason)||'';document.getElementById('blockModal').className='modal-bg on';}
function closeBlock(){document.getElementById('blockModal').className='modal-bg';blockDate=null;}
function saveBlock(){
  if(!blockDate)return;
  var reason=document.getElementById('block-reason').value.trim();
  if(BLOCKED[blockDate]&&!reason){delete BLOCKED[blockDate];}
  else{BLOCKED[blockDate]={reason:reason};}
  try{localStorage.setItem('blocked_'+curUser.id,JSON.stringify(BLOCKED));}catch(e){}
  closeBlock();renderCal();
}

// JOURNAL
function renderJournal(){
  var cats=['전체','기본마술','마장마술','장애물','자격증','외승','미분류'];
  var filtered=ENTRIES.filter(function(e){
    if(jFilter==='전체')return true;
    if(jFilter==='외승')return e.type==='trail';
    if(jFilter==='미분류')return e.type!=='trail'&&!e.cat;
    return e.type!=='trail'&&e.cat===jFilter;
  }).slice().reverse();
  var h='<div style="margin-top:13px"><div class="filter-bar">'+cats.map(function(c){return'<button class="filter-chip'+(c===jFilter?' on':'')+'" onclick="setJFilter(\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<div style="font-size:10px;color:var(--tx3);font-weight:600;margin-bottom:10px">'+filtered.length+'개</div>';
  if(!filtered.length)h+='<div class="empty"><div class="empty-icon">🐴</div><div class="empty-title">기록이 없어요</div></div>';
  else filtered.forEach(function(e){h+=makeEntryCard(e);});
  h+='</div>';
  document.getElementById('pg-journal').innerHTML=h;
}
function setJFilter(f){jFilter=f;renderJournal();}

// PASSES
function renderPasses(){
  var active=PASSES.filter(function(p){return p.remain>0;});
  var done=PASSES.filter(function(p){return p.remain<=0;});
  var groups={};
  active.forEach(function(p){if(!groups[p.stable])groups[p.stable]=[];groups[p.stable].push(p);});
  var h='<div style="margin-top:13px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<div style="font-size:12px;color:var(--tx3);font-weight:600">'+active.length+'개 이용중</div>'
    +'<button onclick="openNewPass()" style="font-size:12px;font-weight:700;color:var(--br2);background:var(--br5);border:1px solid var(--sep);border-radius:17px;padding:5px 11px">+ 쿠폰 등록</button>'
    +'</div>';
  Object.keys(groups).sort().forEach(function(stable){
    var passes=groups[stable].sort(function(a,b){return(a.purchase||'')>(b.purchase||'')?1:-1;});
    h+='<div class="pass-group-label">'+stable+'</div>';
    passes.forEach(function(p,idx){
      var tag=passes.length>1?String(idx+1).padStart(2,'0'):'';
      var remain=p.remain,total=p.total||0,used=total-remain;
      var pct=total?Math.round(remain/total*100):0;
      var isLow=remain>0&&remain<=3;
      var dd=dday(p.expiry);
      var per=(p.price&&total)?Math.round(p.price/total):null;
      var statusCls=isLow?'low':'ok';
      var statusText=isLow?'잔여부족':'이용중';
      h+='<div class="pass-card">'
        +'<div class="pass-card-row">'
        +'<div><span class="pass-name">'+p.stable+'</span>'+(tag?'<span class="pass-tag">'+tag+'</span>':'')+'</div>'
        +'<div style="display:flex;gap:4px;align-items:center">'
        +'<span class="pass-status '+statusCls+'">'+statusText+'</span>'
        +(dd!=null?'<span class="pass-status '+(dd<=14?'low':'ok')+'">D-'+dd+'</span>':'')
        +'<button class="pass-act-btn pass-act-edit" onclick="openEditPass(\''+p.id+'\')">수정</button>'
        +'<button class="pass-act-btn pass-act-del" onclick="confirmDelete(\'pass\',\''+p.id+'\',\''+p.stable+'\')">삭제</button>'
        +'</div></div>'
        +'<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'
        +'<span class="pass-remain-big'+(isLow?' low':'')+'">'+remain+'</span>'
        +'<span style="font-size:11px;color:var(--tx3)">/ '+total+'회 남음</span>'
        +(p.expiry?'<span style="font-size:10px;color:var(--tx3);margin-left:4px">~'+p.expiry.slice(5)+'</span>':'')
        +'</div>'
        +'<div class="pass-info-compact">'
        +(p.purchase?'<span>구매 <b>'+p.purchase.slice(2)+'</b></span>':'')
        +(p.price?'<span>총 <b>'+fmt(p.price)+'</b></span>':'')
        +(per?'<span>회당 <b>'+fmt(per)+'</b></span>':'')
        +(p.pay_method?'<span>결제 <b>'+p.pay_method+'</b></span>':'')
        +'</div>'
        +'<div class="pass-bar-bg"><div class="pass-bar-fill" style="width:'+pct+'%;background:'+(isLow?'var(--red)':'var(--green)')+'"></div></div>'
        +'</div>';
    });
  });
  // 사용완료
  if(done.length){
    h+='<div class="pass-section-done"><div class="pass-done-toggle" onclick="toggleDone()">사용완료 쿠폰 '+done.length+'개 '+(showDonePasses?'▲':'▼')+'</div>';
    if(showDonePasses){
      done.forEach(function(p){
        h+='<div class="pass-card" style="opacity:.55;margin-top:6px">'
          +'<div class="pass-card-row"><span class="pass-name">'+p.stable+'</span>'
          +'<div style="display:flex;gap:4px"><span class="pass-status done">사용완료</span>'
          +'<button class="pass-act-btn pass-act-del" onclick="confirmDelete(\'pass\',\''+p.id+'\',\''+p.stable+'\')">삭제</button></div></div>'
          +'<div style="font-size:11px;color:var(--tx3)">'+(p.total||'?')+'회 · '+(p.expiry||'')+'</div></div>';
      });
    }
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('pg-passes').innerHTML=h;
}

// STATS
function renderStats(){
  var years=[...new Set(ENTRIES.map(function(e){return(e.date||'').slice(0,4);}).filter(Boolean))].sort().reverse();
  var fd=statsYear==='전체'?ENTRIES:ENTRIES.filter(function(e){return(e.date||'').startsWith(statsYear);});
  var lessons=fd.filter(function(e){return e.type!=='trail';});
  var trails=fd.filter(function(e){return e.type==='trail';});
  var totalCost=fd.reduce(function(a,e){
    if(e.trail_price)return a+Number(e.trail_price);
    var p=PASSES.find(function(p){return p.stable===e.stable;});
    return a+(p&&p.price&&p.total?Math.round(p.price/p.total):0);
  },0);
  var h='<div style="margin-top:13px"><div class="stats-year-tabs">'+['전체',...years].map(function(y){return'<button class="stats-year-tab'+(y===statsYear?' on':'')+'" onclick="setStatsYear(\''+y+'\')">'+y+'</button>';}).join('')+'</div>';
  h+='<div class="stats-summary">'
    +[['레슨',lessons.length+'회'],['외승',trails.length+'회'],['비용',totalCost?fmt(totalCost):'-'],['총 기록',fd.length+'개']].map(function(x){return'<div class="stats-card"><div class="stats-val">'+x[1]+'</div><div class="stats-lbl">'+x[0]+'</div></div>';}).join('')
    +'</div>';
  if(statsYear!=='전체'){
    h+='<div class="stats-sec-title">월별 레슨</div><div class="stats-month-grid">';
    for(var m=1;m<=12;m++){var mS=statsYear+'-'+String(m).padStart(2,'0');var cnt=lessons.filter(function(e){return(e.date||'').startsWith(mS);}).length;h+='<div class="stats-month-card"><div class="stats-month-num">'+m+'월</div><div class="stats-month-val">'+cnt+'</div></div>';}
    h+='</div>';
  }
  function mk(arr,fn){var o={};arr.forEach(function(e){var k=fn(e);if(k)o[k]=(o[k]||0)+1;});return Object.entries(o).sort(function(a,b){return b[1]-a[1];});}
  function bar(items){if(!items.length)return'<div style="padding:8px;color:var(--tx3);font-size:11px">데이터 없음</div>';var mx=items[0][1];return items.slice(0,8).map(function(x){return'<div class="bar-row"><span class="bar-lbl">'+x[0]+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+(x[1]/mx*100).toFixed(0)+'%"><span class="bar-num">'+x[1]+'</span></div></div></div>';}).join('');}
  h+='<div class="stats-sec-title">종목별</div><div class="bar-card">'+bar(mk(lessons,function(e){return e.cat||'미분류';}))+' </div>';
  h+='<div class="stats-sec-title">승마장별</div><div class="bar-card">'+bar(mk(fd,function(e){return ss(e.stable);}))+' </div>';
  if(statsYear==='전체')h+='<div class="stats-sec-title">연도별</div><div class="bar-card">'+bar(mk(fd,function(e){return(e.date||'').slice(0,4);}))+' </div>';
  h+='</div>';
  document.getElementById('pg-stats').innerHTML=h;
}
function setStatsYear(y){statsYear=y;renderStats();}

// SEARCH
function renderSearchTags(){
  var tagMap={};
  ENTRIES.forEach(function(e){extractTags((e.brief||'')+(e.detail||'')).forEach(function(t){tagMap[t]=(tagMap[t]||0)+1;});});
  var top=Object.entries(tagMap).sort(function(a,b){return b[1]-a[1];}).slice(0,20);
  document.getElementById('search-tag-cloud').innerHTML=top.map(function(x){return'<button class="search-tag" onclick="setSearchQ(\''+x[0]+'\')">'+x[0]+'</button>';}).join('');
}
function doSearch(){
  var q=document.getElementById('search-q').value.trim();
  var resEl=document.getElementById('search-results');
  if(!q){resEl.innerHTML='';return;}
  var r=ENTRIES.filter(function(e){
    var full=(e.stable||'')+(e.horse||'')+(e.cat||'')+(e.brief||'')+(e.detail||'')+(e.coach||'');
    if(q.startsWith('#')){var tags=extractTags((e.brief||'')+(e.detail||''));return tags.some(function(t){return t.startsWith(q);});}
    return full.includes(q);
  }).slice().reverse();
  if(!r.length)resEl.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">결과 없음</div></div>';
  else resEl.innerHTML='<div style="font-size:10px;color:var(--tx3);font-weight:600;margin-bottom:9px">'+r.length+'개</div>'+r.map(makeEntryCard).join('');
}
function setSearchQ(t){document.getElementById('search-q').value=t;doSearch();}

function updatePassPreview(){
  var sel=document.getElementById('f-stable');var custom=document.getElementById('f-stable-custom');
  if(!sel)return;
  var isOther=sel.value==='__other__';
  if(custom)custom.style.display=isOther?'block':'none';
  var stable=isOther?(custom?custom.value:''): sel.value;
  var p=PASSES.find(function(x){return x.stable===stable;});
  var el=document.getElementById('pass-preview');
  if(el){if(p&&p.remain>0){el.style.display='block';el.style.background=p.remain<=3?'var(--redL)':'var(--greenL)';el.style.color=p.remain<=3?'var(--red)':'var(--green)';el.textContent='기승권 '+p.remain+'회 남음 · ~'+p.expiry.slice(5);}else el.style.display='none';}
}

async function saveEntry(){
  var sel=document.getElementById('f-stable');var custom=document.getElementById('f-stable-custom');
  var stable=sel&&sel.value==='__other__'?(custom?custom.value.trim():''):(sel?sel.value:'');
  var dt=document.getElementById('f-date').value;
  if(!stable){showToast('승마장을 선택해주세요');return;}
  if(!dt){showToast('날짜를 입력해주세요');return;}
  var catSel=document.querySelector('#cat-chips .chip.on');
  var row={user_id:curUser.id,date:dt,type:fType,stable:stable,
    horse:document.getElementById('f-horse').value.trim(),
    horse_type:document.getElementById('f-horse-type').value.trim(),
    coach:document.getElementById('f-coach').value.trim(),
    cat:fType==='trail'?'외승':(catSel?catSel.textContent:fCat||'마장마술'),
    cert_name:document.getElementById('f-cert')?document.getElementById('f-cert').value.trim():'',
    saddle:document.getElementById('f-saddle').value.trim(),
    rein:document.getElementById('f-rein').value.trim(),
    temp:document.getElementById('f-temp').value,
    weather:document.getElementById('f-weather').value.trim(),
    brief:document.getElementById('f-brief').value.trim(),
    detail:document.getElementById('f-detail').value.trim(),
    is_fall:document.getElementById('f-fall').checked,
    is_trip:fType==='trail',
    duration:fDur,
    pay_method:fPayMethod,
    trail_price:fType==='trail'?(document.getElementById('f-trail-price')?Number(document.getElementById('f-trail-price').value)||null:null):null,
    arena:fType==='trail'?'야외':'실내'};
  if(editEntryId){
    await sbUpdate('entries',editEntryId,row);
    var idx=ENTRIES.findIndex(function(e){return e.id===editEntryId;});
    if(idx>=0)ENTRIES[idx]=Object.assign({},ENTRIES[idx],row,{isTrip:fType==='trail'});
    showToast('수정됐어! 🐴');
  } else {
    var saved=await sbAdd('entries',row);
    if(saved){
      ENTRIES.push(Object.assign({},row,{id:saved.id,isTrip:fType==='trail'}));
      ENTRIES.sort(function(a,b){return a.date<b.date?-1:1;});
      if(fType!=='trail'){var p=PASSES.find(function(x){return x.stable===stable&&dt<=TODAY&&x.remain>0;});if(p){p.remain--;await sbUpdate('passes',p.id,{remain:p.remain});}}
      showToast('저장됐어! 🐴');
    }
  }
  closeEntry();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  if(curTab==='passes')renderPasses();
}

// AI 요약
async function aiSummarize(){
  var detail=document.getElementById('f-detail').value.trim();
  if(!detail){showToast('상세 일지를 먼저 작성해주세요');return;}
  var btn=document.querySelector('.ai-btn');btn.textContent='✨ 요약 중...';btn.disabled=true;
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,
        messages:[{role:'user',content:'아래 승마 기승 일지를 핵심만 3-4줄로 요약해줘. 자세/고삐/추진/말특징 중 중요한 포인트 위주로, 한국어로.\n\n'+detail}]})
    });
    var data=await res.json();
    if(data.content&&data.content[0])document.getElementById('f-brief').value=data.content[0].text;
    showToast('요약 완료! ✨');
  }catch(err){showToast('API 키 설정이 필요해요');}
  btn.textContent='✨ AI 요약';btn.disabled=false;
}

// PASS FORM
function renderPassForm(p){
  var v=p||{};
  var isOne=v.total===1;
  return '<div class="form-section"><label class="form-lbl">승마장명</label>'
    +'<div class="autocomplete-wrap"><input class="form-input" type="text" id="p-stable" value="'+(v.stable||'')+'" placeholder="승마장" autocomplete="off"></div></div>'
    +'<div class="form-section"><label class="form-lbl">총 횟수</label>'
    +'<div class="form-chips" id="p-count-chips">'+[1,10,20,30].map(function(n){return'<button class="chip'+(v.total===n?' on':'')+'" onclick="setPCount('+n+',this)">'+n+'회</button>';}).join('')
    +'<button class="chip'+(v.total&&![1,10,20,30].includes(v.total)?' on':'')+'" onclick="setPCount(-1,this)">직접</button></div>'
    +'<input class="form-input" type="number" id="p-total-custom" value="'+(v.total&&![1,10,20,30].includes(v.total)?v.total:'')+'" placeholder="횟수" style="display:'+(v.total&&![1,10,20,30].includes(v.total)?'block':'none')+';margin-top:6px"></div>'
    +'<div class="form-section"><div class="form-row col2">'
    +'<div><label class="form-lbl">구매일</label><input class="form-input" type="date" id="p-purchase" value="'+(v.purchase||'')+'"></div>'
    +'<div><label class="form-lbl">'+(isOne?'사용일':'만료일')+'</label><input class="form-input" type="date" id="p-expiry" value="'+(v.expiry||'')+'"></div>'
    +'</div></div>'
    +'<div class="form-section"><div class="form-row col2">'
    +'<div><label class="form-lbl">쿠폰 가격 (원)</label><input class="form-input" type="number" id="p-price" value="'+(v.price||'')+'" placeholder="총 금액"></div>'
    +'<div><label class="form-lbl">결제 방식</label><div class="form-chips" id="pp-pay">'+['현금','카드'].map(function(pm){return'<button class="chip'+(v.pay_method===pm?' on':'')+'" onclick="setPassPay(\''+pm+'\',this)">'+pm+'</button>';}).join('')+'</div></div>'
    +'</div></div>'
    +'<button class="save-btn" onclick="savePass()">저장</button>';
}
var passPayMethod='';
function setPassPay(p,btn){passPayMethod=p;document.querySelectorAll('#pp-pay .chip').forEach(function(b){b.className='chip';});if(btn)btn.className='chip on';}
function openNewPass(){editPassId=null;pCount=10;passPayMethod='';document.getElementById('pass-modal-title').textContent='쿠폰 등록';document.getElementById('pass-modal-body').innerHTML=renderPassForm(null);document.getElementById('passModal').className='modal-bg on';setupAutocomplete('p-stable',getStables);}
function openEditPass(id){var p=PASSES.find(function(x){return x.id===id;});if(!p)return;editPassId=id;pCount=p.total||10;passPayMethod=p.pay_method||'';document.getElementById('pass-modal-title').textContent='쿠폰 수정';document.getElementById('pass-modal-body').innerHTML=renderPassForm(p);document.getElementById('passModal').className='modal-bg on';setupAutocomplete('p-stable',getStables);}
function closePass(){document.getElementById('passModal').className='modal-bg';}
function setPCount(n,btn){pCount=n;document.querySelectorAll('#p-count-chips .chip').forEach(function(b){b.className='chip';});if(btn)btn.className='chip on';document.getElementById('p-total-custom').style.display=(n===-1?'block':'none');}
async function savePass(){
  var stable=document.getElementById('p-stable').value.trim();
  if(!stable){showToast('승마장명을 입력해주세요');return;}
  var total=pCount===-1?parseInt(document.getElementById('p-total-custom').value)||0:pCount;
  var row={user_id:curUser.id,stable,total,remain:editPassId?(PASSES.find(function(p){return p.id===editPassId;})||{}).remain||total:total,
    purchase:document.getElementById('p-purchase').value,expiry:document.getElementById('p-expiry').value,
    price:parseInt(document.getElementById('p-price').value)||0,pay_method:passPayMethod};
  if(editPassId){await sbUpdate('passes',editPassId,row);var idx=PASSES.findIndex(function(p){return p.id===editPassId;});if(idx>=0)PASSES[idx]=Object.assign({},PASSES[idx],row);showToast('수정됐어!');}
  else{var saved=await sbAdd('passes',row);if(saved){PASSES.push(Object.assign({},row,{id:saved.id}));showToast('등록됐어!');}}
  closePass();renderPasses();
}

// DELETE
function confirmDelete(type,id,label){deleteTarget={type,id};document.getElementById('confirm-sub').textContent=label+'\n복구할 수 없어요.';document.getElementById('confirmModal').className='confirm-bg on';}
function closeConfirm(){document.getElementById('confirmModal').className='confirm-bg';deleteTarget=null;}
async function doConfirm(){
  if(!deleteTarget)return;
  var type=deleteTarget.type,id=deleteTarget.id;
  await sbDelete(type==='entry'?'entries':'passes',id);
  if(type==='entry'){ENTRIES=ENTRIES.filter(function(e){return e.id!==id;});var el=document.getElementById('ec-'+id);if(el)el.remove();}
  else{PASSES=PASSES.filter(function(p){return p.id!==id;});renderPasses();}
  closeConfirm();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  showToast('삭제됐어');
}

// IMPORT
async function importData(){
  if(!confirm('기존 기승 데이터를 불러올까요?\n이미 임포트했다면 중복될 수 있어요.'))return;
  try{
    var res=await fetch('./import_data.json');var data=await res.json();
    var BATCH=20,success=0;
    for(var i=0;i<data.length;i+=BATCH){
      var batch=data.slice(i,i+BATCH).map(function(r){return{user_id:curUser.id,date:r.date,num:r.num,type:r.type,stable:r.stable,horse:r.horse||'',coach:r.coach||'',cat:r.cat,arena:r.arena||'실내',is_trip:r.is_trip||false,gear:r.gear||'',temp:r.temp||'',hum:r.hum||'',brief:r.brief||'',detail:r.detail||'',is_fall:false};});
      var{error}=await sb.from('entries').insert(batch);
      if(!error)success+=batch.length;
      await new Promise(function(r){setTimeout(r,300);});
    }
    showToast('완료! '+success+'개 🎉');await loadData();renderCal();
  }catch(err){showToast('실패: '+err.message);}
}
</script>
