<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Equitation Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{
  --bg:#F5EFE6;--card:#FFFDF9;--card2:#FDF6EC;
  --br:#5C3D1E;--br2:#8B5E3C;--br3:#C4956A;--br4:#E8D5B7;--br5:#F5EFE6;
  --sep:rgba(92,61,30,0.15);--sep2:rgba(92,61,30,0.08);
  --tx:#2C1A0E;--tx2:rgba(44,26,14,0.6);--tx3:rgba(44,26,14,0.35);
  --green:#2D7A4F;--greenL:rgba(45,122,79,0.1);
  --red:#C0392B;--redL:rgba(192,57,43,0.1);
  --purple:#7B3FA0;--purpleL:rgba(123,63,160,0.1);
  --pink:#C0547A;--pinkL:rgba(192,84,122,0.1);
  --blue:#2C5F8A;--blueL:rgba(44,95,138,0.1);
  --orange:#B8530A;--orangeL:rgba(184,83,10,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font-family:inherit}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;background:linear-gradient(160deg,#3D1F0A 0%,#5C3D1E 40%,#8B5E3C 100%)}
.login-logo{font-size:64px;margin-bottom:20px}
.login-title{font-size:36px;font-weight:900;color:#FFFDF9;letter-spacing:-1px;margin-bottom:4px}
.login-sub{font-size:14px;color:rgba(255,253,249,0.6);margin-bottom:48px;letter-spacing:.5px;text-transform:uppercase}
.google-btn{display:flex;align-items:center;gap:12px;background:#FFFDF9;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;color:var(--tx);box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.google-btn svg{width:22px;height:22px}

/* HEADER */
.hd{background:rgba(92,61,30,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:48px 20px 14px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(196,149,106,0.3)}
.hd-inner{display:flex;justify-content:space-between;align-items:flex-end}
.hd-label{font-size:10px;font-weight:700;color:var(--br3);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.hd-title{font-size:28px;font-weight:900;color:#FFFDF9;letter-spacing:-1px;line-height:1}
.hd-right{display:flex;gap:8px;align-items:center}
.hd-add{background:rgba(255,253,249,0.15);border:1px solid rgba(255,253,249,0.25);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;color:#FFFDF9}
.hd-avatar{width:32px;height:32px;border-radius:50%;border:2px solid rgba(196,149,106,0.5);overflow:hidden;cursor:pointer}
.hd-avatar img{width:100%;height:100%;object-fit:cover}

/* TABS */
.tabs{display:flex;background:rgba(92,61,30,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:98px;z-index:99;border-bottom:1px solid rgba(196,149,106,0.2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:10px 4px;font-size:11px;font-weight:600;color:rgba(255,253,249,0.45);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;transition:color .15s}
.tab.on{color:var(--br3);border-bottom-color:var(--br3);font-weight:800}

/* CONTENT */
.ct{padding:16px;padding-bottom:100px}
.dn{display:none}

/* CARD BASE */
.card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(92,61,30,0.08);border:1px solid var(--sep2)}

/* ENTRY CARD */
.ec{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(92,61,30,0.08);border:1px solid var(--sep2);transition:border-color .2s}
.ec.open{border-color:var(--br3)}
.ec-head{padding:14px 16px;cursor:pointer}
.ec-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ec-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.badge-마장마술{background:var(--purpleL);color:var(--purple)}
.badge-기본마술{background:var(--blueL);color:var(--blue)}
.badge-장애물{background:var(--orangeL);color:var(--orange)}
.badge-자격증{background:var(--greenL);color:var(--green)}
.badge-외승{background:var(--pinkL);color:var(--pink)}
.badge-미분류{background:rgba(92,61,30,0.08);color:var(--tx3)}
.badge-trail{background:var(--pinkL);color:var(--pink)}
.badge-future{background:rgba(92,61,30,0.06);color:var(--tx3);border:1px dashed var(--sep)}
.ec-date{font-size:12px;font-weight:600;color:var(--tx3)}
.ec-stable{font-size:19px;font-weight:900;color:var(--tx);letter-spacing:-.8px;margin-bottom:3px}
.ec-horse{font-size:13px;color:var(--tx2);margin-bottom:6px}
.ec-meta{display:flex;gap:5px;flex-wrap:wrap}
.ec-meta-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:8px;background:var(--br5);color:var(--tx2);border:1px solid var(--sep2)}
.ec-fall{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--redL);color:var(--red);border:1px solid rgba(192,57,43,0.2)}
.ec-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.ec-body.open{max-height:3000px}
.ec-body-inner{border-top:1px solid var(--sep2);padding:14px 16px}
.ec-section{margin-bottom:12px}
.ec-section-label{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.ec-section-text{font-size:14px;color:var(--tx);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ec-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ec-tag{font-size:12px;font-weight:600;color:var(--br2)}
.ec-actions{display:flex;gap:8px;margin-top:12px}
.ec-btn-edit{flex:1;padding:9px;background:var(--br5);border:1px solid var(--sep);border-radius:10px;font-size:13px;font-weight:600;color:var(--br2)}
.ec-btn-del{flex:1;padding:9px;background:var(--redL);border:1px solid rgba(192,57,43,0.2);border-radius:10px;font-size:13px;font-weight:600;color:var(--red)}

/* FUTURE ENTRY (미래 날짜) */
.ec-future{opacity:.55}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;margin-top:8px}
.cal-ym{font-size:22px;font-weight:900;color:var(--tx);letter-spacing:-.8px}
.cal-arrows{display:flex;gap:6px;align-items:center}
.cal-arrow{background:var(--card);border:1px solid var(--sep);border-radius:8px;width:32px;height:32px;font-size:14px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.cal-today-btn{background:var(--br2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:#fff}
.cal-legend{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-legend-item{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--tx3)}
.cal-legend-dot{width:7px;height:7px;border-radius:50%}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--tx3);padding:4px 0;letter-spacing:.3px}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-day{min-height:52px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;cursor:pointer;transition:all .12s;border:1px solid transparent}
.cal-day.has-entry{background:var(--card);border-color:var(--sep2);box-shadow:0 1px 4px rgba(92,61,30,0.06)}
.cal-day.today{border-color:var(--br2)!important;background:rgba(139,94,60,0.06)!important}
.cal-day.selected{border-color:var(--br)!important;border-width:1.5px!important}
.cal-day.holiday{background:rgba(192,57,43,0.04)}
.cal-day-num{font-size:11px;font-weight:700;padding:4px 4px 2px;text-align:left;color:var(--tx)}
.cal-day.today .cal-day-num{color:var(--br2);font-weight:900}
.cal-day.sun .cal-day-num{color:var(--red)}
.cal-day.sat .cal-day-num{color:var(--blue)}
.cal-day.holiday .cal-day-num{color:var(--red)}
.cal-dot{font-size:8px;font-weight:700;padding:1px 4px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:1px solid transparent}
.cal-dot.ride{background:rgba(123,63,160,0.08);color:var(--purple);border-top-color:rgba(123,63,160,0.15)}
.cal-dot.trail{background:var(--pinkL);color:var(--pink);border-top-color:rgba(192,84,122,0.15)}
.cal-dot.future{background:rgba(92,61,30,0.04);color:var(--tx3);border-top-color:var(--sep2)}
.cal-dot.fall{background:var(--redL);color:var(--red);border-top-color:rgba(192,57,43,0.2)}
.day-detail{margin-top:14px;padding-top:14px;border-top:2px solid var(--br4)}
.day-detail-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.day-date-big{font-size:20px;font-weight:900;color:var(--tx);letter-spacing:-.5px}
.day-add-btn{background:var(--br);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;color:#fff}

/* PASSES */
.pass-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:8px;border:1px solid var(--sep2);box-shadow:0 2px 8px rgba(92,61,30,0.06)}
.pass-stable{font-size:16px;font-weight:800;color:var(--tx);letter-spacing:-.3px;margin-bottom:10px}
.pass-row-main{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pass-count{border-radius:10px;padding:10px;text-align:center}
.pass-count.remain{background:var(--greenL)}
.pass-count.used{background:var(--br5)}
.pass-count-num{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1px}
.pass-count.remain .pass-count-num{color:var(--green)}
.pass-count.used .pass-count-num{color:var(--tx3)}
.pass-count-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:3px;color:var(--tx3)}
.pass-info-row{display:flex;justify-content:space-between;font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--sep2);margin-bottom:6px}
.pass-info-lbl{color:var(--tx3);font-weight:500}
.pass-info-val{color:var(--tx);font-weight:700}
.pass-bar-bg{height:4px;background:var(--br4);border-radius:2px;overflow:hidden;margin-top:8px}
.pass-bar-fill{height:100%;border-radius:2px;background:var(--green);transition:width .5s}
.pass-bar-pct{font-size:10px;color:var(--tx3);font-weight:500;text-align:right;margin-top:3px}
.pass-low .pass-count.remain{background:var(--redL)}
.pass-low .pass-count.remain .pass-count-num{color:var(--red)}
.pass-low .pass-bar-fill{background:var(--red)}
.pass-add-btn{width:100%;padding:13px;background:var(--card);border:1.5px dashed var(--sep);border-radius:12px;font-size:14px;font-weight:600;color:var(--tx3)}

/* STATS */
.stats-year-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.stats-year-tabs::-webkit-scrollbar{display:none}
.stats-year-tab{flex-shrink:0;padding:7px 18px;border-radius:20px;border:1px solid var(--sep);background:var(--card);font-size:13px;font-weight:700;color:var(--tx2)}
.stats-year-tab.on{background:var(--br);border-color:var(--br);color:#fff}
.stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stats-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--sep2)}
.stats-val{font-size:24px;font-weight:900;color:var(--br);letter-spacing:-1px;line-height:1;margin-bottom:3px}
.stats-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase}
.stats-month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats-month-card{background:var(--card);border-radius:10px;padding:10px;border:1px solid var(--sep2);text-align:center}
.stats-month-num{font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:4px}
.stats-month-val{font-size:16px;font-weight:900;color:var(--tx);letter-spacing:-.5px}
.stats-month-sub{font-size:10px;color:var(--tx3);margin-top:2px}
.stats-sec-title{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stats-sec-title::after{content:'';flex:1;height:1px;background:var(--sep)}
.bar-card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--sep2)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-lbl{font-size:11px;font-weight:600;color:var(--tx2);width:64px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:14px;background:var(--br5);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--br2);border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:20px;transition:width .5s}
.bar-num{font-size:9px;color:#fff;font-weight:800}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:12px}
.search-input{width:100%;padding:11px 16px 11px 42px;background:var(--card);border:1px solid var(--sep);border-radius:12px;font-size:15px;color:var(--tx);outline:none;box-shadow:0 2px 8px rgba(92,61,30,0.06)}
.search-input:focus{border-color:var(--br2)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.search-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.search-tag{padding:5px 12px;border-radius:20px;background:var(--card);border:1px solid var(--sep);font-size:12px;font-weight:600;color:var(--br2);cursor:pointer}
.search-tag:active{background:var(--br5)}

/* FILTER */
.filter-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--card);font-size:12px;font-weight:600;color:var(--tx2)}
.filter-chip.on{background:var(--br);border-color:var(--br);color:#fff}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,26,14,0.5);z-index:300;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:var(--bg);width:100%;max-height:94vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .28s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(245,239,230,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--sep);z-index:1}
.modal-title{font-size:18px;font-weight:800;color:var(--tx);letter-spacing:-.3px}
.modal-close{background:var(--br4);border-radius:50%;width:30px;height:30px;font-size:14px;font-weight:700;color:var(--br2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px 16px 40px}
.form-sec{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--sep2)}
.form-lbl{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.form-lbl span{color:var(--br2);margin-right:4px}
.form-input{width:100%;padding:10px 12px;background:var(--br5);border:1px solid var(--sep);border-radius:10px;font-size:15px;color:var(--tx);outline:none}
.form-input:focus{border-color:var(--br2)}
.form-textarea{width:100%;padding:10px 12px;background:var(--br5);border:1px solid var(--sep);border-radius:10px;font-size:14px;color:var(--tx);outline:none;resize:vertical;line-height:1.75}
.form-textarea:focus{border-color:var(--br2)}
.form-select{width:100%;padding:10px 12px;background:var(--br5);border:1px solid var(--sep);border-radius:10px;font-size:15px;color:var(--tx);outline:none;appearance:none}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-sel-row{display:flex;gap:6px;flex-wrap:wrap}
.form-sel{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--br5);font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:all .12s}
.form-sel.on{background:var(--br);border-color:var(--br);color:#fff}
.form-sel-duo{display:flex;gap:8px}
.form-sel-duo .form-sel{flex:1;text-align:center}
.form-check{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--redL);border:1px solid rgba(192,57,43,0.2);border-radius:10px;cursor:pointer}
.form-check input{width:18px;height:18px;accent-color:var(--red)}
.form-check-lbl{font-size:13px;font-weight:700;color:var(--red)}
.save-btn{width:100%;padding:15px;background:var(--br);border-radius:14px;font-size:16px;font-weight:800;color:#fff;margin-top:14px;letter-spacing:-.3px}
.ai-btn{width:100%;padding:11px;background:linear-gradient(135deg,#4A1C8C,#7B3FA0);border-radius:10px;font-size:13px;font-weight:700;color:#fff;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}

/* CONFIRM */
.confirm-bg{display:none;position:fixed;inset:0;background:rgba(44,26,14,0.5);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.confirm-bg.on{display:flex}
.confirm-box{background:var(--card);border-radius:18px;width:100%;max-width:290px;overflow:hidden;box-shadow:0 20px 60px rgba(92,61,30,0.2)}
.confirm-body{padding:20px;text-align:center}
.confirm-title{font-size:17px;font-weight:800;margin-bottom:6px;color:var(--tx)}
.confirm-sub{font-size:13px;color:var(--tx2);line-height:1.5}
.confirm-btns{display:flex;border-top:1px solid var(--sep)}
.confirm-btn{flex:1;padding:14px;font-size:17px}
.confirm-btn.cancel{color:var(--br2);font-weight:500;border-right:1px solid var(--sep)}
.confirm-btn.del{color:var(--red);font-weight:700}

/* EMPTY */
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--tx3);line-height:1.5}

/* IMPORT */
.import-banner{background:linear-gradient(135deg,var(--br),var(--br2));border-radius:14px;padding:16px;margin-bottom:14px;color:#fff}
.import-banner-title{font-size:15px;font-weight:800;margin-bottom:4px}
.import-banner-sub{font-size:12px;opacity:.8;margin-bottom:12px}
.import-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;color:#fff;width:100%}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-logo">🐴</div>
  <div class="login-title">Equitation Journal</div>
  <div class="login-sub">My Riding Log</div>
  <button class="google-btn" onclick="signInGoogle()">

function extractTags(t){if(!t)return[];var m=t.match(/#[\w가-힣]+/g);return m?[...new Set(m)]:[]; }

function fmtDate(d){if(!d)return'';var w=['일','월','화','수','목','금','토'];var dt=new Date(d+'T00:00:00');return d.slice(5).replace('-','/')+'('+w[dt.getDay()]+')'; }

// ── ENTRY CARD ──
function isFuture(date){return date>TODAY;}
function catBadge(e){
  var cat=e.type==='trail'?'외승':(e.cat||'미분류');
  return '<span class="badge badge-'+cat+'">'+cat+'</span>';
}
function makeEntryCard(e){
  var future=isFuture(e.date);
  var tags=extractTags((e.brief||'')+(e.detail||''));
  var weather=e.temp?e.temp+'°C'+(e.hum?' '+e.hum+'%':''):'';
  var meta=[e.saddle?'안장: '+e.saddle:'',e.rein?'고삐: '+e.rein:'',e.coach?'코치: '+e.coach:'',e.duration?e.duration+'min':'',weather].filter(Boolean);
  return '<div class="ec'+(future?' ec-future':'')+(e.is_fall?' ec-fall-card':'')+'" id="ec-'+e.id+'">'
    +'<div class="ec-head" onclick="togEC(\''+e.id+'\')">'
    +'<div class="ec-row1">'
    +'<div class="ec-badges">'+catBadge(e)+(e.is_fall?'<span class="badge" style="background:var(--redL);color:var(--red)">⚠ 낙마</span>':'')+(future?'<span class="badge badge-future">예정</span>':'')+'</div>'
    +'<span class="ec-date">'+fmtDate(e.date)+(e.num&&e.num<9999?' #'+Math.floor(e.num):'')+'</span>'
    +'</div>'
    +'<div class="ec-stable">'+e.stable+'</div>'
    +(e.horse?'<div class="ec-horse">'+e.horse+(e.horse_type?' · '+e.horse_type:'')+'</div>':'')
    +(meta.length?'<div class="ec-meta">'+meta.map(function(t){return'<span class="ec-meta-tag">'+t+'</span>';}).join('')+'</div>':'')
    +'</div>'
    +'<div class="ec-body" id="body-'+e.id+'">'
    +'<div class="ec-body-inner">'
    +(e.brief?'<div class="ec-section"><div class="ec-section-label">간단 메모</div><div class="ec-section-text">'+e.brief+'</div></div>':'')
    +(e.detail?'<div class="ec-section"><div class="ec-section-label">상세 일지</div><div class="ec-section-text">'+e.detail+'</div></div>':'')
    +(tags.length?'<div class="ec-tags">'+tags.map(function(t){return'<span class="ec-tag">'+t+'</span>';}).join('')+'</div>':'')
    +'<div class="ec-actions">'
    +'<button class="ec-btn-edit" onclick="openEditEntry(\''+e.id+'\')">수정</button>'
    +'<button class="ec-btn-del" onclick="confirmDelete(\'entry\',\''+e.id+'\',\''+e.stable+' '+fmtDate(e.date)+'\')">삭제</button>'
    +'</div>'
    +'</div></div></div>';
}

function togEC(id){

// ── CALENDAR ──
function renderCal(){
  var byD={};
  ENTRIES.forEach(function(e){if(e.date){if(!byD[e.date])byD[e.date]=[];byD[e.date].push(e);}});
  var fd=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();

  var h='<div class="cal-nav">'
    +'<div class="cal-ym">'+calY+'년 '+MO[calM]+'</div>'
    +'<div class="cal-arrows">'
    +'<button class="cal-today-btn" onclick="goToday()">오늘</button>'
    +'<button class="cal-arrow" onclick="moveCal(-1)">‹</button>'
    +'<button class="cal-arrow" onclick="moveCal(1)">›</button>'
    +'</div></div>'
    +'<div class="cal-legend">'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--purple)"></div>기승</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--pink)"></div>외승</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--tx3)"></div>예정</div>'
    +'<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--red)"></div>낙마</div>'
    +'</div>'
    +'<div class="cal-grid">';

  DW.forEach(function(d,i){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div></div>';

  for(var day=1;day<=dim;day++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var es=byD[ds]||[];
    var isT=ds===TODAY,isSel=ds===selDate,hasE=es.length>0;
    var dow=new Date(ds+'T00:00:00').getDay();
    var mmdd=String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isHoliday=!!HOLIDAYS[mmdd];
    var cls=['cal-day'];
    if(hasE)cls.push('has-entry');
    if(isT)cls.push('today');
    if(isSel)cls.push('selected');
    if(dow===0||isHoliday)cls.push('sun');
    if(dow===6)cls.push('sat');
    if(isHoliday)cls.push('holiday');

    h+='<div class="'+cls.join(' ')+'" onclick="selDay(\''+ds+'\')">'
      +'<div class="cal-day-num">'+day+'</div>';

    if(hasE){
      es.forEach(function(e){
        var future=isFuture(e.date);
        var cls2=future?'future':e.type==='trail'?'trail':'ride';
        if(e.is_fall)cls2='fall';
        var pass=PASSES.find(function(p){return p.stable===e.stable;});
        var passInfo=pass?'('+pass.remain+'회)':'';
        h+='<div class="cal-dot '+cls2+'">'+ss(e.stable)+passInfo+'</div>';
      });
    }
    h+='</div>';
  }
  h+='</div>';

  if(selDate){
    var ses=byD[selDate]||[];
    h+='<div class="day-detail">'
      +'<div class="day-detail-hd">'
      +'<div class="day-date-big">'+fmtDate(selDate)+'</div>'
      +'<button class="day-add-btn" onclick="openNewEntry(\''+selDate+'\')">+ 추가</button>'
      +'</div>';
    if(ses.length)ses.forEach(function(e){h+=makeEntryCard(e);});
    else h+='<div class="empty" style="padding:30px 20px"><div class="empty-icon">📝</div><div class="empty-title">이 날의 기록이 없어요</div></div>';
    h+='</div>';
  }

  // 임포트 배너 (데이터 없을 때)
  if(ENTRIES.length===0){
    h='<div class="import-banner">'
      +'<div class="import-banner-title">📥 기존 기승 데이터 불러오기</div>'
      +'<div class="import-banner-sub">구글 캘린더에서 파싱한 300개 기록을 불러옵니다</div>'
      +'<button class="import-btn" onclick="importData()">데이터 임포트 시작</button>'
      +'</div>'+h;
  }

  document.getElementById('pg-cal').innerHTML=h;
}

function moveCal(dir){calM+=dir;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}selDate=null;renderCal();}
function selDay(ds){selDate=(selDate===ds)?null:ds;renderCal();}
function goToday(){calY=new Date().getFullYear();calM=new Date().getMonth();selDate=TODAY;renderCal();}

// ── JOURNAL ──
function renderJournal(){
  var cats=['전체','기본마술','마장마술','장애물','자격증','외승','미분류'];
  var filtered=ENTRIES.filter(function(e){
    if(jFilter==='전체')return true;
    if(jFilter==='외승')return e.type==='trail';
    if(jFilter==='미분류')return e.type!=='trail'&&!e.cat;
    return e.type!=='trail'&&e.cat===jFilter;
  }).slice().reverse();

  var h='<div style="margin-top:14px">'
    +'<div class="filter-bar">'+cats.map(function(c){return'<button class="filter-chip'+(c===jFilter?' on':'')+'" onclick="setJFilter(\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<div style="font-size:12px;color:var(--tx3);font-weight:500;margin-bottom:12px">'+filtered.length+'개</div>';

  if(!filtered.length)h+='<div class="empty"><div class="empty-icon">🐴</div><div class="empty-title">기록이 없어요</div></div>';
  else filtered.forEach(function(e){h+=makeEntryCard(e);});
  h+='</div>';
  document.getElementById('pg-journal').innerHTML=h;
}
function setJFilter(f){jFilter=f;renderJournal();}

// ── PASSES ──
function renderPasses(){
  // 승마장별로 그룹, 구매일 순
  var groups={};
  PASSES.forEach(function(p){
    if(!groups[p.stable])groups[p.stable]=[];
    groups[p.stable].push(p);
  });

  var h='<div style="margin-top:14px">';
  Object.keys(groups).sort().forEach(function(stable){
    var passes=groups[stable].sort(function(a,b){return(a.purchase||'')>(b.purchase||'')?1:-1;});
    h+='<div style="font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px">'+stable+'<span style="flex:1;height:1px;background:var(--sep)"></span></div>';
    passes.forEach(function(p){
      var remain=p.remain,used=(p.total||0)-remain;
      var pct=p.total?Math.round(remain/p.total*100):0;
      var isLow=remain<=3;
      var dd=dday(p.expiry);
      var per=(p.price&&p.total)?Math.round(p.price/p.total):null;
      h+='<div class="pass-card'+(isLow?' pass-low':'')+'" style="border-color:'+(isLow?'rgba(192,57,43,0.3)':'var(--sep2)')+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
        +'<div class="pass-stable">'+p.stable+(p.purchase?' <span style="font-size:11px;font-weight:500;color:var(--tx3)">('+p.purchase+')</span>':'')+'</div>'
        +'<div style="display:flex;gap:5px;align-items:center">'
        +(isLow?'<span class="badge" style="background:var(--redL);color:var(--red)">부족</span>':'')
        +(dd!=null?'<span class="badge" style="background:'+(dd<=14?'var(--redL)':'var(--br5)')+';color:'+(dd<=14?'var(--red)':'var(--tx3)')+'">D-'+dd+'</span>':'')
        +'<button onclick="openEditPass(\''+p.id+'\')" style="font-size:11px;color:var(--br2);font-weight:600;padding:3px 8px;background:var(--br5);border-radius:8px;border:1px solid var(--sep)">수정</button>'
        +'<button onclick="confirmDelete(\'pass\',\''+p.id+'\',\''+p.stable+' 이용권\')" style="font-size:11px;color:var(--red);font-weight:600;padding:3px 8px;background:var(--redL);border-radius:8px;border:1px solid rgba(192,57,43,0.2)">삭제</button>'
        +'</div></div>'
        +'<div class="pass-row-main">'
        +'<div class="pass-count remain"><div class="pass-count-num">'+remain+'</div><div class="pass-count-lbl">남은 횟수</div></div>'
        +'<div class="pass-count used"><div class="pass-count-num">'+used+'</div><div class="pass-count-lbl">사용 횟수</div></div>'
        +'</div>'
        +[p.total?['총 횟수',p.total+'회']:null,p.expiry?['만료일',p.expiry]:null,p.price?['쿠폰가격',fmt(p.price)]:null,per?['회당가격',fmt(per)]:null].filter(Boolean).map(function(r){return'<div class="pass-info-row"><span class="pass-info-lbl">'+r[0]+'</span><span class="pass-info-val">'+r[1]+'</span></div>';}).join('')
        +'<div class="pass-bar-bg"><div class="pass-bar-fill" style="width:'+pct+'%'+(isLow?';background:var(--red)':'')+'"></div></div>'
        +'<div class="pass-bar-pct">'+pct+'% 남음</div>'
        +'</div>';
    });
  });

  if(!PASSES.length)h+='<div class="empty"><div class="empty-icon">🎫</div><div class="empty-title">등록된 이용권이 없어요</div></div>';

var statsYear='전체';
function renderStats(){
  var years=[...new Set(ENTRIES.map(function(e){return(e.date||'').slice(0,4);}).filter(Boolean))].sort().reverse();

  var h='<div style="margin-top:14px">'
    +'<div class="stats-year-tabs">'
    +['전체',...years].map(function(y){return'<button class="stats-year-tab'+(y===statsYear?' on':'')+'" onclick="setStatsYear(\''+y+'\')">'+y+'</button>';}).join('')
    +'</div>';

  var fd=statsYear==='전체'?ENTRIES:ENTRIES.filter(function(e){return(e.date||'').startsWith(statsYear);});
  var rides=fd.filter(function(e){return e.type!=='trail';});
  var trails=fd.filter(function(e){return e.type==='trail';});
  var totalCost=rides.reduce(function(a,e){var p=PASSES.find(function(p){return p.stable===e.stable;});return a+(p&&p.price&&p.total?Math.round(p.price/p.total):0);},0);

  // 요약
  h+='<div class="stats-summary">'
    +[['기승',rides.length+'회'],['외승',trails.length+'회'],['기승 비용',totalCost?fmt(totalCost):'-'],['총 기록',fd.length+'개']].map(function(x){return'<div class="stats-card"><div class="stats-val">'+x[1]+'</div><div class="stats-lbl">'+x[0]+'</div></div>';}).join('')
    +'</div>';

  // 월별 (연도 선택시)
  if(statsYear!=='전체'){
    h+='<div class="stats-sec-title">월별 기승</div>'
      +'<div class="stats-month-grid">';
    for(var m=1;m<=12;m++){
      var mStr=statsYear+'-'+String(m).padStart(2,'0');
      var mEntries=fd.filter(function(e){return(e.date||'').startsWith(mStr);});
      var mRides=mEntries.filter(function(e){return e.type!=='trail';}).length;
      var mCost=mEntries.reduce(function(a,e){var p=PASSES.find(function(p){return p.stable===e.stable;});return a+(p&&p.price&&p.total?Math.round(p.price/p.total):0);},0);
      h+='<div class="stats-month-card"><div class="stats-month-num">'+m+'월</div><div class="stats-month-val">'+mRides+'</div><div class="stats-month-sub">'+(mCost?fmt(mCost):'-')+'</div></div>';
    }
    h+='</div>';
  }

  function mk(arr,fn){var o={};arr.forEach(function(e){var k=fn(e);if(k)o[k]=(o[k]||0)+1;});return Object.entries(o).sort(function(a,b){return b[1]-a[1];});}
  function bar(items){if(!items.length)return'<div style="padding:10px;color:var(--tx3);font-size:12px">데이터 없음</div>';var mx=items[0][1];return items.slice(0,8).map(function(x){return'<div class="bar-row"><span class="bar-lbl">'+x[0]+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+(x[1]/mx*100).toFixed(0)+'%"><span class="bar-num">'+x[1]+'</span></div></div></div>';}).join('');}

  h+='<div class="stats-sec-title">종목별</div><div class="bar-card">'+bar(mk(rides,function(e){return e.cat||'미분류';}))+' </div>';
  h+='<div class="stats-sec-title">승마장별</div><div class="bar-card">'+bar(mk(fd,function(e){return ss(e.stable);}))+' </div>';
  if(statsYear==='전체')h+='<div class="stats-sec-title">연도별</div><div class="bar-card">'+bar(mk(fd,function(e){return(e.date||'').slice(0,4);}))+' </div>';

  h+='</div>';
  document.getElementById('pg-stats').innerHTML=h;
}

function renderSearchTags(){
  var tagMap={};
  ENTRIES.forEach(function(e){extractTags((e.brief||'')+(e.detail||'')).forEach(function(t){tagMap[t]=(tagMap[t]||0)+1;});});
  var top=Object.entries(tagMap).sort(function(a,b){return b[1]-a[1];}).slice(0,15).map(function(x){return x[0];});
  document.getElementById('search-tag-cloud').innerHTML=top.map(function(t){return'<button class="search-tag" onclick="setSearchQ(\''+t+'\')">'+t+'</button>';}).join('');
}

function doSearch(){
  var q=document.getElementById('search-q').value.trim();
  var resEl=document.getElementById('search-results');
  if(!q){resEl.innerHTML='';return;}
  var r=ENTRIES.filter(function(e){
    var score=0;
    var full=(e.stable||'')+(e.horse||'')+(e.cat||'')+(e.brief||'')+(e.detail||'');
    if(full.includes(q))score+=1;
    var tags=extractTags((e.brief||'')+(e.detail||''));
    if(q.startsWith('#')&&tags.includes(q))score+=3;
    return score>0;
  }).slice().reverse();
  if(!r.length)resEl.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">결과 없음</div></div>';
  else resEl.innerHTML='<div style="font-size:12px;color:var(--tx3);font-weight:500;margin-bottom:10px">'+r.length+'개</div>'+r.map(makeEntryCard).join('');
}

async function saveEntry(){
  var sel=document.getElementById('f-stable');
  var custom=document.getElementById('f-stable-custom');
  var stable=sel&&sel.value==='__other__'?(custom?custom.value.trim():''): (sel?sel.value:'');
  var dt=document.getElementById('f-date').value;
  if(!stable){showToast('승마장을 선택해주세요');return;}
  if(!dt){showToast('날짜를 입력해주세요');return;}
  var catSel=document.querySelector('#cat-btns .form-sel.on');
  var row={
    user_id:curUser.id,date:dt,type:fType,stable:stable,
    horse:document.getElementById('f-horse').value.trim(),
    horse_type:document.getElementById('f-horse-type').value.trim(),
    coach:document.getElementById('f-coach').value.trim(),
    cat:fType==='trail'?'외승':(catSel?catSel.textContent:'미분류'),
    saddle:document.getElementById('f-saddle').value.trim(),
    rein:document.getElementById('f-rein').value.trim(),
    temp:document.getElementById('f-temp').value,
    weather:document.getElementById('f-weather').value.trim(),
    brief:document.getElementById('f-brief').value.trim(),
    detail:document.getElementById('f-detail').value.trim(),
    is_fall:document.getElementById('f-fall').checked,
    is_trip:fType==='trail',arena:'실내'
  };

  if(editEntryId){
    await sbUpdate('entries',editEntryId,row);
    var idx=ENTRIES.findIndex(function(e){return e.id===editEntryId;});
    if(idx>=0)ENTRIES[idx]=Object.assign({},ENTRIES[idx],row,{isTrip:fType==='trail'});
    showToast('수정됐어! 🐴');
  } else {
    var saved=await sbAdd('entries',row);
    if(saved){
      ENTRIES.push(Object.assign({},row,{id:saved.id,isTrip:fType==='trail'}));
      ENTRIES.sort(function(a,b){return a.date<b.date?-1:1;});
      // 기승권 차감
      var p=PASSES.find(function(x){return x.stable===stable&&dt<=TODAY;});
      if(p&&p.remain>0){p.remain--;await sbUpdate('passes',p.id,{remain:p.remain});}
      showToast('저장됐어! 🐴');
    }
  }
  closeEntry();
  if(curTab==='cal')renderCal();
  if(curTab==='journal')renderJournal();
  if(curTab==='passes')renderPasses();
}

async function importData(){
  if(!confirm('기존 기승 데이터 300개를 불러올까요?\n중복 실행하면 데이터가 중복될 수 있어요.'))return;
  showToast('불러오는 중...');
  try{
    var res=await fetch('./import_data.json');
    var data=await res.json();
    var BATCH=20,success=0;
    for(var i=0;i<data.length;i+=BATCH){
      var batch=data.slice(i,i+BATCH).map(function(r){return{
        user_id:curUser.id,date:r.date,num:r.num,type:r.type,stable:r.stable,
        horse:r.horse||'',coach:r.coach||'',cat:r.cat,arena:r.arena||'실내',
        is_trip:r.is_trip||false,gear:r.gear||'',temp:r.temp||'',hum:r.hum||'',
        brief:r.brief||'',detail:r.detail||''
      };});
      var{error}=await sb.from('entries').insert(batch);
      if(!error)success+=batch.length;
      await new Promise(function(r){setTimeout(r,300);});
    }
    showToast('완료! '+success+'개 불러옴 🎉');
    await loadData();
    renderCal();
  }catch(err){showToast('실패: '+err.message);}
}
